<template>
    <nav class="crumbs" aria-label="Breadcrumb">
        <ol class="crumbs__list">
            <template for:each={itemView} for:item="c">
                <li key={c.renderKey} class="crumbs__item">
                    <template if:true={c.showSep}>
                        <span class="crumbs__sep" aria-hidden="true">›</span>
                    </template>
                    <template if:true={c.ellipsis}>
                        <span class="crumbs__more-wrap" onkeydown={handleMenuKeydown}>
                            <button type="button" class="crumbs__more"
                                    aria-label={c.moreLabel}
                                    title={c.moreLabel}
                                    aria-haspopup="menu"
                                    aria-expanded={c.menuExpanded}
                                    onclick={handleMoreToggle}>…</button>
                            <template if:true={c.menuOpen}>
                                <ul class="crumbs__menu" role="menu" aria-label="Hidden levels">
                                    <template for:each={c.hidden} for:item="h">
                                        <li key={h.renderKey} role="none">
                                            <template if:true={h.clickable}>
                                                <a href="#" role="menuitem" class="crumbs__menu-link"
                                                   data-key={h.key} onclick={handleClick}>{h.label}</a>
                                            </template>
                                            <template if:false={h.clickable}>
                                                <span role="menuitem" class="crumbs__menu-text">{h.label}</span>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                        </span>
                    </template>
                    <template if:true={c.clickable}>
                        <a href="#" class="crumbs__link" data-key={c.key}
                           onclick={handleClick}>{c.label}</a>
                    </template>
                    <template if:false={c.clickable}>
                        <template if:false={c.ellipsis}>
                            <span class="crumbs__current" aria-current="page">{c.label}</span>
                        </template>
                    </template>
                </li>
            </template>
        </ol>
    </nav>
</template>
