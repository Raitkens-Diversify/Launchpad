<template>
    <nav class="ds-pager" aria-label="Pagination">
        <span class="ds-pager__caption" aria-live="polite">{caption}</span>
        <template if:true={showButtons}>
            <div class="ds-pager__controls">
                <button type="button" class="ds-pager__btn" disabled={prevDisabled}
                        onclick={handlePrevious}>‹ Previous</button>
                <template for:each={pageItems} for:item="item">
                    <template if:true={item.isGap}>
                        <span key={item.key} class="ds-pager__gap" aria-hidden="true">…</span>
                    </template>
                    <template if:false={item.isGap}>
                        <button key={item.key} type="button" class={item.cssClass}
                                aria-current={item.current}
                                data-page={item.page}
                                onclick={handlePage}>{item.label}</button>
                    </template>
                </template>
                <button type="button" class="ds-pager__btn" disabled={nextDisabled}
                        onclick={handleNext}>Next ›</button>
            </div>
        </template>
    </nav>
</template>
