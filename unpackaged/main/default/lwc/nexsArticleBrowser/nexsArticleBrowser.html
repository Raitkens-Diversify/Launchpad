<template>
    <!-- The page frame is c-ds-page (full width: sidebar + content, and the
         article view alike); the help band below stays a full-bleed sibling. -->
    <c-ds-page>
    <div class={nexsClass}>
        <!-- Topics sidebar hides on the article view — the article gets its own
             page layout (breadcrumb + article + Suggested Articles), like Hulu. -->
        <template if:false={showViewer}>
        <!-- Phone widths only (CSS): the sidebar becomes a drawer behind this button. -->
        <button type="button" class="nexs__nav-toggle"
                aria-expanded={navToggleExpanded}
                onclick={handleNavToggle}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
                <path d="M3 6h18M3 12h18M3 18h18"></path>
            </svg>
            {navToggleLabel}
        </button>
        <aside class={navClass} onkeydown={handleNavKeydown}>
            <c-ds-tree heading="All topics"
                       roots={navRoots}
                       active-key={navActiveKey}
                       show-counts
                       onnavselect={handleNavSelect}></c-ds-tree>
        </aside>
        </template>

        <main class="nexs__main">
            <!-- Breadcrumb (all views): Help Center › ancestors… › topic [› article] -->
            <c-ds-breadcrumbs items={crumbItems}
                              collapse-at="4"
                              oncrumbselect={handleCrumbSelect}></c-ds-breadcrumbs>

            <!-- Article detail (inline) -->
            <template if:true={showViewer}>
                <div class={articleLayoutClass}>
                    <c-nexs-article-viewer
                        article-id={selectedArticleId}
                        onarticleload={handleArticleLoad}
                        onarticlelink={handleArticleLink}
                    ></c-nexs-article-viewer>
                    <!-- Right rail: always mounted so articleResources can report
                         whether the article has resources (it renders nothing when
                         empty); the grid collapses to one column when the whole
                         rail is empty. -->
                    <aside class="nexs__rail">
                        <template if:true={hasSuggested}>
                            <div class="nexs__related">
                                <h2 class="nexs__related-title">Suggested Articles</h2>
                                <ul class="nexs__related-list">
                                    <template for:each={suggestedArticles} for:item="r">
                                        <li key={r.id}>
                                            <a
                                                href="#"
                                                class="nexs__row-link"
                                                data-id={r.id}
                                                data-urlname={r.urlName}
                                                onclick={handleArticleClick}
                                                onmouseenter={handlePrefetch}
                                                onfocus={handlePrefetch}
                                            >{r.title}</a>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </template>
                        <c-article-resources
                            article-id={selectedArticleId}
                            onresourcesload={handleResourcesLoad}
                        ></c-article-resources>
                    </aside>
                </div>
            </template>

            <!-- Collapsible sections of article links -->
            <template if:false={showViewer}>
                <!-- The page is the top-level topic; the cascading pill rows
                     narrow it in place (same handler as the sidebar). -->
                <template if:true={showTitle}>
                    <h1 class="nexs__title">{browseTitle}</h1>
                </template>
                <template if:true={showFilterRows}>
                    <c-subtopic-filter-rows rows={filterRowsData}
                                            onnavselect={handleNavSelect}></c-subtopic-filter-rows>
                </template>

                <template if:true={loadingArticles}>
                    <lightning-spinner alternative-text="Loading articles" size="small"></lightning-spinner>
                </template>

                <template if:true={showFuzzyBanner}>
                    <p class="nexs__fuzzy">
                        Showing results for <strong>{corrected}</strong>.
                        <a href="#" class="nexs__fuzzy-link" onclick={handleSearchOriginal}>Search for &ldquo;{searchTerm}&rdquo; instead</a>
                    </p>
                </template>

                <!-- Search scope: the whole Help Center, or the topic (and everything
                     under it) the reader was browsing when they searched. -->
                <template if:true={showScopeBar}>
                    <div class="nexs__scope">
                        <template if:true={searchScope}>
                            <span class="nexs__scope-chip">
                                Within <strong>{scopeLabel}</strong>
                                <button type="button" class="nexs__scope-clear"
                                        aria-label="Search the whole Help Center"
                                        title="Search the whole Help Center"
                                        onclick={handleScopeOff}>&times;</button>
                            </span>
                        </template>
                        <template if:false={searchScope}>
                            <button type="button" class="nexs__scope-btn" onclick={handleScopeOn}>{scopeOfferLabel}</button>
                        </template>
                    </div>
                </template>

                <!-- Category browse: the count line with the compact Type facet,
                     then every article in the selected subtree, flat, each row
                     tagged with where it lives relative to the selection. -->
                <template if:true={showToolbar}>
                    <div class="nexs__toolbar">
                        <p class="nexs__count" aria-live="polite">{countLine}</p>
                        <template if:true={showTypeChips}>
                            <c-ds-filter-chips label="Type"
                                               compact
                                               group-label="Filter by type"
                                               chips={typeChips}
                                               selected={typeFilter}
                                               onselect={handleTypeSelect}></c-ds-filter-chips>
                        </template>
                    </div>
                </template>
                <template if:true={showList}>
                    <c-ds-item-list items={browseRows}
                                    onitemselect={handleListSelect}
                                    onitemhover={handleListHover}
                                    onpathselect={handlePathSelect}></c-ds-item-list>
                </template>
                <template if:true={showTypeEmpty}>
                    <p class="nexs__empty">
                        {typeEmptyText}
                        <button type="button" class="nexs__link-btn" onclick={handleTypeClear}>Show all types</button>
                    </p>
                </template>

                <!-- Search results: one open section of highlighted rows. -->
                <template if:true={hasSections}>
                    <ul class="nexs__sections">
                        <template for:each={sectionView} for:item="sec">
                            <li key={sec.key} class="nexs__section">
                                <button
                                    class="nexs__section-head"
                                    type="button"
                                    data-key={sec.key}
                                    aria-expanded={sec.ariaExpanded}
                                    onclick={handleSectionToggle}
                                >
                                    <span class="nexs__section-title">{sec.title}</span>
                                    <lightning-icon
                                        icon-name={sec.iconName}
                                        size="x-small"
                                        alternative-text="Toggle section"
                                    ></lightning-icon>
                                </button>
                                <ul class={sec.bodyClass}>
                                    <template for:each={sec.articles} for:item="a">
                                        <li key={a.id} class="nexs__row">
                                            <a
                                                href="#"
                                                class="nexs__row-link"
                                                data-id={a.id}
                                                data-urlname={a.urlName}
                                                onclick={handleArticleClick}
                                                onmouseenter={handlePrefetch}
                                                onfocus={handlePrefetch}
                                            >
                                                <span class="nexs__row-title"
                                                    ><template for:each={a.titleSegments} for:item="seg"
                                                        ><template if:true={seg.match}><strong key={seg.key}>{seg.text}</strong></template
                                                        ><template if:false={seg.match}><span key={seg.key}>{seg.text}</span></template
                                                    ></template
                                                ></span>
                                                <template if:true={a.showSummary}>
                                                    <span class="nexs__row-summary">{a.summary}</span>
                                                </template>
                                            </a>
                                            <template if:true={a.featured}>
                                                <c-ds-badge label="Featured" variant="info"></c-ds-badge>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </li>
                        </template>
                    </ul>
                </template>

                <template if:true={showEmpty}>
                    <p class="nexs__empty">No articles here yet.</p>
                </template>

                <template if:true={showZeroResults}>
                    <div class="nexs__zero">
                        <p class="nexs__zero-lead">No results for &ldquo;{searchTerm}&rdquo;.</p>
                        <template if:true={hasFallback}>
                            <p class="nexs__zero-sub">Popular articles</p>
                            <ul class="nexs__zero-list">
                                <template for:each={fallbackView} for:item="f">
                                    <li key={f.id} class="nexs__row">
                                        <a
                                            href="#"
                                            class="nexs__row-link"
                                            data-id={f.id}
                                            data-urlname={f.urlName}
                                            onclick={handleArticleClick}
                                            onmouseenter={handlePrefetch}
                                            onfocus={handlePrefetch}
                                        >{f.title}</a>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template lwc:if={zeroCtaUrl}>
                            <c-ds-button class="nexs__zero-cta" label={contactSupportLabel}
                                         href={zeroCtaUrl}></c-ds-button>
                        </template>
                    </div>
                </template>
            </template>
        </main>
    </div>
    </c-ds-page>

    <!-- "Need more help?" contact band — the shared c-resource-help-band
         (targets come from Resource_Center_Setting__mdt). -->
    <c-resource-help-band></c-resource-help-band>
</template>
