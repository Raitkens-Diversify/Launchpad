<template>
  <article
    class="div-card arc-task-metrics"
    aria-labelledby="arc-task-metrics-title"
  >
    <template lwc:if={isInitialLoading}>
      <div class="arc-task-metrics__loading">
        <c-arc-loading-spinner
          alternative-text="Loading task metrics"
          size="small"
        ></c-arc-loading-spinner>
      </div>
    </template>

    <template lwc:else>
      <div class="div-card__body div-card__body--stack arc-task-metrics__body">
        <section class="arc-task-metrics__panel" aria-label="My tasks">
          <div class="arc-task-metrics__panel-header">
            <div class="arc-task-metrics__title-row">
              <h2 id="arc-task-metrics-title" class="arc-task-metrics__panel-label">
                My Tasks
              </h2>
              <span
                class="arc-task-metrics__info-icon"
                style={infoIconStyle}
                title="Open tasks grouped by main track and pit stop categories."
                aria-hidden="true"
              ></span>
            </div>
            <p class="arc-task-metrics__subtitle">Main track vs pit stop</p>
          </div>

          <template lwc:if={myErrorMessage}>
            <div
              class="slds-notify slds-notify_alert slds-alert_error"
              role="alert"
            >
              {myErrorMessage}
            </div>
          </template>
          <div class="arc-task-metrics__panel-rows">
            <template for:each={myMetricRows} for:item="row">
              <div key={row.key} class="arc-task-metrics__row">
                <div class="arc-task-metrics__row-header">
                  <span class="arc-task-metrics__row-label">{row.label}</span>
                  <span class="arc-task-metrics__row-count">{row.count}</span>
                </div>
                <div class="arc-task-metrics__bar" aria-hidden="true">
                  <div
                    class="arc-task-metrics__bar-fill-wrapper"
                    data-bar-key={row.key}
                    data-bar-target-width={row.percent}
                  >
                    <div class={row.barClass}></div>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </section>

        <div class="arc-task-metrics__divider" aria-hidden="true"></div>

        <section class="arc-task-metrics__panel" aria-label="My Team tasks">
          <div class="arc-task-metrics__panel-header">
            <p class="arc-task-metrics__panel-label">My Team Tasks</p>
            <p class="arc-task-metrics__subtitle">Main track vs pit stop</p>
          </div>

          <template lwc:if={teamErrorMessage}>
            <div
              class="slds-notify slds-notify_alert slds-alert_error"
              role="alert"
            >
              {teamErrorMessage}
            </div>
          </template>
          <div class="arc-task-metrics__panel-rows">
            <template for:each={teamMetricRows} for:item="row">
              <div key={row.key} class="arc-task-metrics__row">
                <div class="arc-task-metrics__row-header">
                  <span class="arc-task-metrics__row-label">{row.label}</span>
                  <span class="arc-task-metrics__row-count">{row.count}</span>
                </div>
                <div class="arc-task-metrics__bar" aria-hidden="true">
                  <div
                    class="arc-task-metrics__bar-fill-wrapper"
                    data-bar-key={row.key}
                    data-bar-target-width={row.percent}
                  >
                    <div class={row.barClass}></div>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </section>
      </div>
    </template>
  </article>
</template>
