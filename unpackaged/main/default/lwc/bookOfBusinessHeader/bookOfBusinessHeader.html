<template>

    <p class="div-page-header__subtitle">{subtitle}</p>
    <div class="div-header-meta">
      <span class="div-header-meta__item">
        <lightning-icon icon-name="utility:user" size="xx-small" aria-hidden="true"></lightning-icon>
        <span>{accountCount} client accounts</span>

        <span class="div-header-meta__value">{totalAumLabel} AUM</span>
      </span>
    </div>
