<template>
  <div class="arc-case-feed">
    <!-- c/dsTabs is ARC's own tab strip, used unmodified so this panel's tabs
         look and behave like every other tab strip in the site. Two tabs only:
         there is no Files tab by design. -->
    <c-ds-tabs
      tabs={tabs}
      selected={activeTab}
      label="Record activity"
      ontabchange={handleTabChange}
    ></c-ds-tabs>

    <!-- ============================ FEED ============================ -->
    <template lwc:if={showFeed}>
      <div class="arc-case-feed__panel" role="tabpanel" aria-label="Feed">
        <template lwc:if={isFeedLoading}>
          <div class="arc-case-feed__loading">
            <lightning-spinner
              alternative-text="Loading feed"
              size="small"
            ></lightning-spinner>
          </div>
        </template>

        <template lwc:if={feedError}>
          <p class="arc-case-feed__error" role="alert">{feedError}</p>
        </template>

        <template lwc:if={hasFeedEntries}>
          <ul class="arc-case-feed__list">
            <template for:each={feedEntries} for:item="entry">
              <li key={entry.id} class="arc-case-feed__item">
                <p class="arc-case-feed__actor">{entry.actorName}</p>
                <p class="arc-case-feed__date">
                  <lightning-formatted-date-time
                    value={entry.createdDate}
                    year="numeric"
                    month="long"
                    day="numeric"
                    hour="2-digit"
                    minute="2-digit"
                  ></lightning-formatted-date-time>
                </p>

                <template lwc:if={entry.hasHeader}>
                  <p class="arc-case-feed__header">{entry.header}</p>
                </template>

                <template lwc:if={entry.hasBody}>
                  <p class="arc-case-feed__body">{entry.body}</p>
                </template>

                <!-- The field-by-field detail of a creation or change post.
                     A blank value is still listed, the way Lightning lists it,
                     because "this field was set to nothing" is information. -->
                <template lwc:if={entry.hasChanges}>
                  <dl class="arc-case-feed__changes">
                    <template for:each={entry.changes} for:item="change">
                      <div key={change.key} class="arc-case-feed__change">
                        <dt class="arc-case-feed__change-label">
                          {change.label}:
                        </dt>
                        <dd class="arc-case-feed__change-value">
                          <template lwc:if={change.showOldValue}>
                            <span class="arc-case-feed__change-old"
                              >{change.oldValue}</span
                            >
                            <span
                              class="arc-case-feed__change-arrow"
                              aria-label="changed to"
                              >&rarr;</span
                            >
                          </template>
                          {change.newValue}
                        </dd>
                      </div>
                    </template>
                  </dl>
                </template>

                <!-- Comments under the post, oldest first, then the composer —
                     the per-post "Write a comment..." Lightning's feed has. -->
                <template lwc:if={entry.hasComments}>
                  <ul class="arc-case-feed__comments">
                    <template for:each={entry.comments} for:item="comment">
                      <li key={comment.id} class="arc-case-feed__comment">
                        <p class="arc-case-feed__comment-meta">
                          <span class="arc-case-feed__comment-actor"
                            >{comment.actorName}</span
                          >
                          <lightning-formatted-date-time
                            value={comment.createdDate}
                            year="numeric"
                            month="long"
                            day="numeric"
                            hour="2-digit"
                            minute="2-digit"
                          ></lightning-formatted-date-time>
                        </p>
                        <p class="arc-case-feed__comment-body">
                          {comment.body}
                        </p>
                      </li>
                    </template>
                  </ul>
                </template>

                <div class="arc-case-feed__composer">
                  <lightning-textarea
                    class="arc-case-feed__composer-input"
                    label="Write a comment"
                    variant="label-hidden"
                    placeholder="Write a comment…"
                    value={entry.draft}
                    max-length="4000"
                    data-entry-id={entry.id}
                    onchange={handleDraftChange}
                  ></lightning-textarea>
                  <template lwc:if={entry.composerError}>
                    <p class="arc-case-feed__error" role="alert">
                      {entry.composerError}
                    </p>
                  </template>
                  <div class="arc-case-feed__composer-actions">
                    <button
                      type="button"
                      class="arc-case-feed__composer-button"
                      data-entry-id={entry.id}
                      disabled={entry.composerDisabled}
                      onclick={handleCommentPost}
                    >
                      Comment
                    </button>
                  </div>
                </div>
              </li>
            </template>
          </ul>

          <template lwc:if={feedHasMore}>
            <p class="arc-case-feed__more">
              Older posts are not shown.
            </p>
          </template>
        </template>

        <template lwc:if={showFeedEmpty}>
          <p class="arc-case-feed__empty">No activity on this record yet.</p>
        </template>
      </div>
    </template>

    <!-- ========================== RELATED =========================== -->
    <template lwc:if={showRelated}>
      <div class="arc-case-feed__panel" role="tabpanel" aria-label="Related">
        <template lwc:if={isRelatedLoading}>
          <div class="arc-case-feed__loading">
            <lightning-spinner
              alternative-text="Loading related lists"
              size="small"
            ></lightning-spinner>
          </div>
        </template>

        <template lwc:if={relatedError}>
          <p class="arc-case-feed__error" role="alert">{relatedError}</p>
        </template>

        <article class="arc-case-feed__card">
          <header class="arc-case-feed__card-header">
            <h3 class="arc-case-feed__card-title">Case History</h3>
            <span class="arc-case-feed__card-count">({historyCount})</span>
          </header>

          <template lwc:if={hasHistory}>
            <!-- Stacked label/value per entry, the way Lightning's own history
                 card renders it. Five columns side by side are unreadable in a
                 ~340px rail. Blank values are shown, not skipped: a creation
                 entry has no old or new value and the page still lists both
                 labels. -->
            <ul class="arc-case-feed__rows">
              <template for:each={historyEntries} for:item="entry">
                <li key={entry.id} class="arc-case-feed__row">
                  <dl class="arc-case-feed__row-fields">
                    <div class="arc-case-feed__row-field">
                      <dt class="arc-case-feed__row-label">Date:</dt>
                      <dd class="arc-case-feed__row-value">
                        <lightning-formatted-date-time
                          value={entry.createdDate}
                          year="numeric"
                          month="numeric"
                          day="numeric"
                          hour="2-digit"
                          minute="2-digit"
                        ></lightning-formatted-date-time>
                      </dd>
                    </div>
                    <div class="arc-case-feed__row-field">
                      <dt class="arc-case-feed__row-label">Field:</dt>
                      <dd class="arc-case-feed__row-value">
                        {entry.fieldLabel}
                      </dd>
                    </div>
                    <div class="arc-case-feed__row-field">
                      <dt class="arc-case-feed__row-label">User:</dt>
                      <dd class="arc-case-feed__row-value">
                        {entry.actorName}
                      </dd>
                    </div>
                    <div class="arc-case-feed__row-field">
                      <dt class="arc-case-feed__row-label">Original Value:</dt>
                      <dd class="arc-case-feed__row-value">
                        {entry.oldValue}
                      </dd>
                    </div>
                    <div class="arc-case-feed__row-field">
                      <dt class="arc-case-feed__row-label">New Value:</dt>
                      <dd class="arc-case-feed__row-value">
                        {entry.newValue}
                      </dd>
                    </div>
                  </dl>
                </li>
              </template>
            </ul>

            <template lwc:if={historyHasMore}>
              <p class="arc-case-feed__more">
                Showing the first {historyCount}.
              </p>
            </template>
          </template>

          <template lwc:if={showHistoryEmpty}>
            <p class="arc-case-feed__empty">No history on this record yet.</p>
          </template>
        </article>
      </div>
    </template>
  </div>
</template>
