<template>
    <!-- Author: Hoang Long Vu To | Date: 2026-09-01 -->
    <lightning-modal-header label={modalHeaderLabel}></lightning-modal-header>

    <lightning-modal-body class="create-record-body">
        <template if:true={objectApiName}>
            <template if:true={showLayoutSpinner}>
                <div class="create-record-body__spinner">
                    <lightning-spinner
                        alternative-text="Loading create layout"
                        size="medium"
                    ></lightning-spinner>
                </div>
            </template>

            <template if:true={useLayoutDrivenForm}>
                <lightning-record-edit-form
                    object-api-name={objectApiName}
                    record-type-id={recordTypeId}
                    onsuccess={handleSuccess}
                    onerror={handleError}
                >
                    <lightning-messages></lightning-messages>
                    <div class="create-record-body__fields">
                        <template for:each={layoutFields} for:item="field">
                            <template if:true={field.hasValue}>
                                <lightning-input-field
                                    key={field.key}
                                    field-name={field.name}
                                    value={field.value}
                                ></lightning-input-field>
                            </template>
                            <template if:false={field.hasValue}>
                                <lightning-input-field
                                    key={field.key}
                                    field-name={field.name}
                                ></lightning-input-field>
                            </template>
                        </template>
                    </div>
                    <div class="create-record-body__actions">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCancel}
                        ></lightning-button>
                        <lightning-button
                            class="slds-m-left_x-small"
                            variant="brand"
                            label="Save"
                            type="submit"
                        ></lightning-button>
                    </div>
                </lightning-record-edit-form>
            </template>

            <template if:true={useFallbackRecordForm}>
                <template if:true={hasRecordTypeId}>
                    <lightning-record-form
                        object-api-name={objectApiName}
                        record-type-id={recordTypeId}
                        layout-type={layoutType}
                        mode="create"
                        columns={resolvedFormColumns}
                        onsuccess={handleSuccess}
                        onerror={handleError}
                        oncancel={handleCancel}
                    ></lightning-record-form>
                </template>
                <template if:false={hasRecordTypeId}>
                    <lightning-record-form
                        object-api-name={objectApiName}
                        layout-type={layoutType}
                        mode="create"
                        columns={resolvedFormColumns}
                        onsuccess={handleSuccess}
                        onerror={handleError}
                        oncancel={handleCancel}
                    ></lightning-record-form>
                </template>
            </template>
        </template>
        <template if:false={objectApiName}>
            <p class="slds-text-color_error slds-p-around_medium">
                Object API name is required to create a record.
            </p>
        </template>
    </lightning-modal-body>
</template>
