<!-- Author: Mile Cacanovic -->
<template>
    <div class="strategy">
        <header class="strategy__header">
            <h4 class="strategy__title">Allocations</h4>
            <lightning-button
                label="Add allocation"
                onclick={handleAdd}>
            </lightning-button>
        </header>

        <template lwc:if={hasRows}>
            <!-- Column headers once for the table, rather than a label repeated on every row. -->
            <div class="strategy__columns" aria-hidden="true">
                <span class="strategy__column-label">Strategy</span>
                <span class="strategy__column-label">Target weight</span>
                <span class="strategy__column-label">Dollars</span>
                <span></span>
            </div>

            <div class="strategy__rows">
                <template for:each={rows} for:item="row">
                    <div key={row.id} class="strategy__row">
                        <div class="strategy__cell strategy__cell_strategy">
                            <!-- Searchable combobox rather than lightning-combobox: it filters/typeaheads
                                 the strategy list and gates its options behind its open state. `options`
                                 arrives as a plain, un-proxied copy from envelopeTradeInstructions (see
                                 pickerOptions there) — passing the deeply-nested reactive proxy here made
                                 LWC's membrane recurse for seconds on access. -->
                            <c-envelope-searchable-combobox
                                variant="label-hidden"
                                label="Strategy"
                                placeholder="Select strategy"
                                value={row.strategy}
                                options={options}
                                data-id={row.id}
                                onchange={handleStrategyChange}>
                            </c-envelope-searchable-combobox>
                        </div>

                        <!-- Both value cells are the same shape: a box either way. Where the
                             strategy's rule allows the unit to be recorded the box is a live input;
                             where it does not, the box is disabled and holds the calculated
                             equivalent, with a help icon saying why it is greyed and what its figure
                             is a share of. Greying rather than removing keeps the row's shape and
                             keeps the number visible. Whichever live input the advisor types into
                             becomes the row's recorded basis.

                             The unit sits beside the box, never inside it: a formatter rewrites
                             whatever it is handed, so the cell could never be bound the exact string
                             it just reported, and that equality is what stops these controlled
                             inputs echoing. It is hidden where the box holds an em dash.

                             The disabled box deliberately carries NO change/blur handler: a cell
                             that cannot be typed into needs no echo guard, so the second box per row
                             adds nothing to the surface the I1/I2 invariants have to cover. -->
                        <div class="strategy__cell strategy__cell_value">
                            <template lwc:if={row.pctEditable}>
                                <div class="strategy__field">
                                    <!-- step="any": without it the base input's default step of 1
                                         rejects any decimal weight as "not a valid increment" —
                                         and a fixed step would reject the four-decimal DERIVED
                                         weight this same box is bound when the row is recorded in
                                         dollars (e.g. 9.9995). -->
                                    <lightning-input
                                        class="strategy__input"
                                        type="number"
                                        step="any"
                                        variant="label-hidden"
                                        label="Target weight"
                                        value={row.pctValue}
                                        data-id={row.id}
                                        data-cell="pct"
                                        onchange={handleValueChange}
                                        onblur={handleValueBlur}>
                                    </lightning-input>
                                    <template lwc:if={row.pctShowsUnit}>
                                        <span class="strategy__unit" aria-hidden="true">%</span>
                                    </template>
                                </div>
                            </template>
                            <template lwc:else>
                                <!-- An exception sleeve lands here too, and needs no branch of its
                                     own: it is locked to dollars, so this is already the greyed
                                     box, and the word "Excluded" arrives as its read-out with the
                                     unit symbol suppressed (there is no weight for a `%` to
                                     qualify) and its own helptext explaining why. -->
                                <div class="strategy__calculated">
                                    <lightning-input
                                        class={row.pctReadoutClass}
                                        type="text"
                                        variant="label-hidden"
                                        label="Target weight (calculated)"
                                        value={row.pctReadout}
                                        disabled
                                        data-id={row.id}
                                        data-cell="pct">
                                    </lightning-input>
                                    <template lwc:if={row.pctShowsUnit}>
                                        <span class="strategy__unit" aria-hidden="true">%</span>
                                    </template>
                                    <lightning-helptext
                                        content={row.pctHelp}>
                                    </lightning-helptext>
                                </div>
                            </template>
                        </div>

                        <div class="strategy__cell strategy__cell_value">
                            <!-- No currency formatter on the dollar input: a formatter rewrites what
                                 it is handed, so the cell could never be bound the exact value it
                                 just reported — and that equality is what keeps these controlled
                                 inputs from echoing themselves into a loop. Only the read-out form
                                 of this cell is formatted. -->
                            <template lwc:if={row.amtEditable}>
                                <div class="strategy__field">
                                    <template lwc:if={row.amtShowsUnit}>
                                        <span class="strategy__unit" aria-hidden="true">$</span>
                                    </template>
                                    <lightning-input
                                        class="strategy__input"
                                        type="number"
                                        step="0.01"
                                        variant="label-hidden"
                                        label="Amount"
                                        value={row.amtValue}
                                        data-id={row.id}
                                        data-cell="amt"
                                        onchange={handleValueChange}
                                        onblur={handleValueBlur}>
                                    </lightning-input>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="strategy__calculated">
                                    <!-- type="text", not number: this box holds a grouped figure and
                                         shows no spinner on a field nothing can type into. -->
                                    <template lwc:if={row.amtShowsUnit}>
                                        <span class="strategy__unit" aria-hidden="true">$</span>
                                    </template>
                                    <lightning-input
                                        class="strategy__readout"
                                        type="text"
                                        variant="label-hidden"
                                        label="Amount (calculated)"
                                        value={row.amtReadout}
                                        disabled
                                        data-id={row.id}
                                        data-cell="amt">
                                    </lightning-input>
                                    <lightning-helptext
                                        content={row.amtHelp}>
                                    </lightning-helptext>
                                </div>
                            </template>
                        </div>

                        <div class="strategy__cell strategy__cell_remove">
                            <template lwc:if={row.showRemove}>
                                <lightning-button-icon
                                    icon-name="utility:close"
                                    variant="bare"
                                    alternative-text="Remove allocation"
                                    title="Remove allocation"
                                    data-id={row.id}
                                    onclick={handleRemove}>
                                </lightning-button-icon>
                            </template>
                        </div>

                        <!-- The row's note sits on its own compact grid line under the value
                             columns. Inside a cell it would stretch the whole first grid line
                             instead (align-items: start leaves the other cells hanging in the extra
                             height), which read as a large gap between rows.

                             An exception sleeve carries no note here: its weight cell already says
                             "Excluded" and explains itself through the help icon beside it, so a
                             second label under the strategy name only repeated the screen. -->
                        <template lwc:if={row.flag}>
                            <p class={row.flagClass}>{row.flag}</p>
                        </template>
                    </div>
                </template>
            </div>
        </template>
        <template lwc:else>
            <c-ds-empty-state
                message="No allocations yet — add a sleeve.">
            </c-ds-empty-state>
        </template>
    </div>
</template>
