<template>
    <article class="nexs-article">
        <template if:true={loading}>
            <div class="nexs-article__status">
                <lightning-spinner alternative-text="Loading article" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasArticle}>
            <h1 class="nexs-article__title">{article.title}</h1>
            <template if:true={article.summary}>
                <p class="nexs-article__summary">{article.summary}</p>
            </template>

            <template if:true={showToc}>
                <nav class="nexs-article__toc" aria-label="In this article">
                    <span class="nexs-article__toc-title">In this article</span>
                    <ul class="nexs-article__toc-list">
                        <template for:each={headings} for:item="h">
                            <li key={h.id}>
                                <a
                                    href="#"
                                    class={h.cssClass}
                                    data-target={h.id}
                                    onclick={handleTocClick}
                                >{h.text}</a>
                            </li>
                        </template>
                    </ul>
                </nav>
            </template>

            <!-- Body as ordered segments: sanitized html runs (injected in
                 renderedCallback) interleaved with Scribe guides lifted out of
                 the body. Clicks from the manual DOM bubble to the wrapper. -->
            <div class="nexs-article__content" onclick={handleBodyClick}>
                <template for:each={segments} for:item="s">
                    <template if:true={s.isHtml}>
                        <div key={s.key} class="nexs-article__body" lwc:dom="manual" data-seg={s.key}></div>
                    </template>
                    <template if:true={s.isEmbed}>
                        <c-scribe-embed key={s.key}
                                        class="nexs-article__guide"
                                        url={s.url}
                                        title={s.title}></c-scribe-embed>
                    </template>
                </template>
            </div>

            <!-- Legacy Embed_URL__c that is not a Scribe link: the raw frame it always had. -->
            <template if:true={legacyEmbedSrc}>
                <iframe
                    class="nexs-article__embed"
                    src={legacyEmbedSrc}
                    title="Embedded guide"
                    allow="fullscreen"
                ></iframe>
            </template>

            <c-nexs-article-rating article-id={article.id}></c-nexs-article-rating>
        </template>

        <template if:true={error}>
            <div class="nexs-article__status nexs-article__error">{error}</div>
        </template>
    </article>
</template>
