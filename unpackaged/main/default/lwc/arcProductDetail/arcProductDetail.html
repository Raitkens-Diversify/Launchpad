<template>
  <div class="arc-product-detail">
    <template lwc:if={isLoading}>
      <div class="arc-product-detail__loading">
        <c-arc-loading-spinner
          alternative-text="Loading product"
          size="medium"
        ></c-arc-loading-spinner>
      </div>
    </template>

    <template lwc:elseif={errorMessage}>
      <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
        {errorMessage}
      </div>
    </template>

    <template lwc:elseif={hasDetail}>
      <!--
        Structure follows ProductRecordPageAdvisors.flexipage: highlights in
        the header, a two-column body -- the always-shown field sections as
        the main column, a tabbed panel (History, Related Products) as a
        narrower left rail. Flipped from Case Detail's own right-rail layout,
        per explicit request: Product has far less to say in a main column
        than a Case does, so the tabs lead instead of trailing.
      -->
      <header class="arc-product-detail__header">
        <div class="arc-product-detail__header-top">
          <div class="arc-product-detail__title-wrap">
            <span class="arc-product-detail__eyebrow">Approved Product</span>
            <h1 class="arc-product-detail__title">{productName}</h1>
          </div>
          <div class="arc-product-detail__badges">
            <template lwc:if={hasStatus}>
              <span class="arc-product-detail__badge">{statusValue}</span>
            </template>
            <template lwc:if={hasPerformanceStatus}>
              <span class={performanceStatusClass}
                >{performanceStatusValue}</span
              >
            </template>
          </div>
        </div>

        <dl class="arc-product-detail__key-facts">
          <template lwc:if={hasAssetCategory}>
            <div class="arc-product-detail__key-fact">
              <dt>Asset Category</dt>
              <dd>{assetCategoryValue}</dd>
            </div>
          </template>
          <template lwc:if={hasAssetClass}>
            <div class="arc-product-detail__key-fact">
              <dt>Asset Class</dt>
              <dd>{assetClassValue}</dd>
            </div>
          </template>
          <template lwc:if={hasSponsor}>
            <div class="arc-product-detail__key-fact">
              <dt>Sponsor</dt>
              <dd>{sponsorValue}</dd>
            </div>
          </template>
          <template lwc:if={hasDateApproved}>
            <div class="arc-product-detail__key-fact">
              <dt>Date Approved</dt>
              <dd>
                <lightning-formatted-date-time
                  value={dateApprovedValue}
                  year="numeric"
                  month="short"
                  day="numeric"
                ></lightning-formatted-date-time>
              </dd>
            </div>
          </template>
        </dl>
      </header>

      <div class="arc-product-detail__body">
        <div class="arc-product-detail__side">
          <div class="arc-product-detail__tabs-card">
            <c-ds-tabs
              tabs={tabs}
              selected={activeTab}
              label="Product record activity"
              ontabchange={handleTabChange}
            ></c-ds-tabs>

            <!-- ============================ HISTORY ============================ -->
            <template lwc:if={showHistory}>
              <div class="arc-product-detail__panel" role="tabpanel" aria-label="History">
                <template lwc:if={isHistoryLoading}>
                  <div class="arc-product-detail__panel-loading">
                    <lightning-spinner
                      alternative-text="Loading history"
                      size="small"
                    ></lightning-spinner>
                  </div>
                </template>

                <template lwc:if={historyError}>
                  <p class="arc-product-detail__panel-error" role="alert">
                    {historyError}
                  </p>
                </template>

                <template lwc:if={hasHistory}>
                  <ul class="arc-product-detail__history-rows">
                    <template for:each={historyEntries} for:item="entry">
                      <li key={entry.id} class="arc-product-detail__history-row">
                        <dl class="arc-product-detail__history-fields">
                          <div class="arc-product-detail__history-field">
                            <dt>Date:</dt>
                            <dd>
                              <lightning-formatted-date-time
                                value={entry.createdDate}
                                year="numeric"
                                month="numeric"
                                day="numeric"
                                hour="2-digit"
                                minute="2-digit"
                              ></lightning-formatted-date-time>
                            </dd>
                          </div>
                          <div class="arc-product-detail__history-field">
                            <dt>Field:</dt>
                            <dd>{entry.fieldLabel}</dd>
                          </div>
                          <div class="arc-product-detail__history-field">
                            <dt>User:</dt>
                            <dd>{entry.actorName}</dd>
                          </div>
                          <div class="arc-product-detail__history-field">
                            <dt>Original Value:</dt>
                            <dd>{entry.oldValue}</dd>
                          </div>
                          <div class="arc-product-detail__history-field">
                            <dt>New Value:</dt>
                            <dd>{entry.newValue}</dd>
                          </div>
                        </dl>
                      </li>
                    </template>
                  </ul>

                  <template lwc:if={historyHasMore}>
                    <p class="arc-product-detail__panel-more">
                      Showing the first {historyCount}.
                    </p>
                  </template>
                </template>

                <template lwc:if={showHistoryEmpty}>
                  <p class="arc-product-detail__panel-empty">
                    No history on this record yet.
                  </p>
                </template>
              </div>
            </template>

            <!-- ======================= RELATED PRODUCTS ======================= -->
            <template lwc:if={showRelatedProducts}>
              <div
                class="arc-product-detail__panel"
                role="tabpanel"
                aria-label="Related Products"
              >
                <c-arc-related-list
                  record-id={recordId}
                  card-label="Related Products"
                  related-object-api-name="Financial_Account_Related_Product__c"
                  parent-field-api-name="Product__c"
                  columns="Financial Account:Wizard_Financial_Account__r.Name,Household:Household__c,Owner:Primary_Owner__c,Amount:Amount__c,Created:CreatedDate"
                ></c-arc-related-list>
              </div>
            </template>
          </div>
        </div>

        <div class="arc-product-detail__main">
          <details class="product-section" open>
            <summary class="product-section__summary">General Information</summary>
            <div class="product-section__body">
              <lightning-record-form
                record-id={recordId}
                object-api-name={objectApiName}
                fields={generalInfoFields}
                columns="2"
                mode="view"
              ></lightning-record-form>
            </div>
          </details>

          <details class="product-section" open>
            <summary class="product-section__summary">Sponsor Information</summary>
            <div class="product-section__body">
              <lightning-record-form
                record-id={recordId}
                object-api-name={objectApiName}
                fields={sponsorInfoFields}
                columns="2"
                mode="view"
              ></lightning-record-form>
            </div>
          </details>
        </div>
      </div>
    </template>
  </div>
</template>
