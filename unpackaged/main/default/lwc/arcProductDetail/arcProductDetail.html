<template>
  <div class="arc-product-detail">
    <template lwc:if={isLoading}>
      <div class="arc-product-detail__loading">
        <c-arc-loading-spinner
          alternative-text="Loading product"
          size="medium"
        ></c-arc-loading-spinner>
      </div>
    </template>

    <template lwc:elseif={errorMessage}>
      <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
        {errorMessage}
      </div>
    </template>

    <template lwc:elseif={hasDetail}>
      <!--
        Structure follows the internal Product record page
        (ProductRecordPageDueDiligence.flexipage): the Details tab's sections
        top to bottom in the main column, gated exactly as the flexipage gates
        them (see rebuildSections in the JS), then its Monitoring Updates and
        Related Properties tabs as trailing cards; Sponsor Information, Notes
        and History in the right rail, as there. Related Products (ARC's own
        addition) leads as a full-width table. Everything is read-only.
      -->
      <header class="arc-product-detail__header">
        <div class="arc-product-detail__header-top">
          <div class="arc-product-detail__title-wrap">
            <span class="arc-product-detail__eyebrow">Approved Product</span>
            <h1 class="arc-product-detail__title">{productName}</h1>
          </div>
          <div class="arc-product-detail__badges">
            <template lwc:if={hasStatus}>
              <span class="arc-product-detail__badge">{statusValue}</span>
            </template>
            <template lwc:if={hasPerformanceStatus}>
              <span class={performanceStatusClass}
                >{performanceStatusValue}</span
              >
            </template>
          </div>
        </div>

        <dl class="arc-product-detail__key-facts">
          <template lwc:if={hasAssetCategory}>
            <div class="arc-product-detail__key-fact">
              <dt>Asset Category</dt>
              <dd>{assetCategoryValue}</dd>
            </div>
          </template>
          <template lwc:if={hasAssetClass}>
            <div class="arc-product-detail__key-fact">
              <dt>Asset Class</dt>
              <dd>{assetClassValue}</dd>
            </div>
          </template>
          <template lwc:if={hasSponsor}>
            <div class="arc-product-detail__key-fact">
              <dt>Sponsor</dt>
              <dd>{sponsorName}</dd>
            </div>
          </template>
          <template lwc:if={hasDateApproved}>
            <div class="arc-product-detail__key-fact">
              <dt>Date Approved</dt>
              <dd>
                <lightning-formatted-date-time
                  value={dateApprovedValue}
                  year="numeric"
                  month="short"
                  day="numeric"
                ></lightning-formatted-date-time>
              </dd>
            </div>
          </template>
        </dl>
      </header>

      <!-- Full-width, collapsible table -- the same c-arc-data-table every
           other ARC table uses, fed by one batched fetch through
           ArcRelatedListController.getRelatedRecordsPage: a product can be
           held across many financial accounts. -->
      <details class="product-section arc-product-detail__related-products" open>
        <summary class="product-section__summary">Related Products</summary>
        <div class="product-section__body">
          <template lwc:if={isRelatedProductsLoading}>
            <div class="arc-product-detail__panel-loading">
              <lightning-spinner
                alternative-text="Loading related products"
                size="small"
              ></lightning-spinner>
            </div>
          </template>

          <template lwc:elseif={relatedProductsError}>
            <p class="arc-product-detail__panel-error" role="alert">
              {relatedProductsError}
            </p>
          </template>

          <template lwc:else>
            <c-arc-data-table
              aria-label="Related Products"
              key-field="id"
              columns={relatedProductsColumns}
              data={relatedProductsRows}
              default-link-object-api-name={relatedProductsObjectApiName}
              placeholder="-"
              enable-row-navigation
              has-more-rows={relatedProductsHasMore}
              is-loading-more={isLoadingMoreRelatedProducts}
              onrownavigate={handleRelatedProductRowNavigate}
              onloadmore={handleRelatedProductsLoadMore}
            ></c-arc-data-table>
          </template>
        </div>
      </details>

      <div class="arc-product-detail__body">
        <div class="arc-product-detail__main">
          <!--
            One entry per section the flexipage would show for THIS record, in
            its order. Each entry carries exactly one kind flag; the record forms
            are mode="readonly" so no inline-edit pencil ever appears.
          -->
          <template for:each={sections} for:item="section">
            <template lwc:if={section.isFields}>
              <details key={section.key} class="product-section" open>
                <summary class="product-section__summary">{section.label}</summary>
                <div class="product-section__body">
                  <lightning-record-form
                    record-id={recordId}
                    object-api-name={objectApiName}
                    fields={section.fields}
                    columns="2"
                    density="comfy"
                    mode="readonly"
                  ></lightning-record-form>
                </div>
              </details>
            </template>

            <template lwc:elseif={section.isRelatedList}>
              <!-- Share Classes / Monitoring Updates / Related Properties: none
                   of these objects has a page of its own in this site, so rows
                   do not link. -->
              <div key={section.key} class="arc-product-detail__related-list">
                <c-arc-related-list
                  record-id={recordId}
                  card-label={section.label}
                  related-object-api-name={section.objectApiName}
                  parent-field-api-name={section.parentFieldApiName}
                  columns={section.columns}
                  disable-row-links
                  collapsible
                ></c-arc-related-list>
              </div>
            </template>

            <template lwc:elseif={section.isTargetedAssetClass}>
              <!-- Eighteen checkboxes internally; only the checked ones are
                   listed here, the way the Advisors page shows them. -->
              <details key={section.key} class="product-section" open>
                <summary class="product-section__summary">{section.label}</summary>
                <div class="product-section__body">
                  <template lwc:if={section.hasItems}>
                    <ul class="arc-product-detail__chips">
                      <template for:each={section.items} for:item="item">
                        <li key={item.key} class="arc-product-detail__chip">
                          {item.label}
                        </li>
                      </template>
                    </ul>
                  </template>
                  <template lwc:else>
                    <p class="arc-product-detail__panel-empty">
                      No targeted asset classes selected.
                    </p>
                  </template>
                </div>
              </details>
            </template>

            <template lwc:elseif={section.isWaterfall}>
              <!-- The internal page edits the order through a flow; this page
                   shows the order that flow saved, ranked, next to the
                   description. -->
              <details key={section.key} class="product-section" open>
                <summary class="product-section__summary">{section.label}</summary>
                <div class="product-section__body">
                  <div class="arc-product-detail__waterfall">
                    <div class="arc-product-detail__waterfall-order">
                      <span class="arc-product-detail__field-label"
                        >Waterfall Order</span
                      >
                      <template lwc:if={section.hasSteps}>
                        <ol class="arc-product-detail__waterfall-steps">
                          <template for:each={section.steps} for:item="step">
                            <li key={step.key}>{step.label}</li>
                          </template>
                        </ol>
                      </template>
                      <template lwc:else>
                        <p class="arc-product-detail__panel-empty">
                          No waterfall order recorded.
                        </p>
                      </template>
                    </div>
                    <lightning-record-form
                      record-id={recordId}
                      object-api-name={objectApiName}
                      fields={section.fields}
                      columns="1"
                      density="comfy"
                      mode="readonly"
                    ></lightning-record-form>
                  </div>
                </div>
              </details>
            </template>
          </template>

          <!-- Files: the internal page's Files tab is the Egnyte for
               Salesforce component; this is ARC's Egnyte embed, the same one
               the Household page's Documents tab uses. It resolves the record
               from the page URL and Egnyte resolves the Product folder from
               the record. -->
          <div class="arc-product-detail__files">
            <c-egnyte-vf-embed
              domain={egnyteDomain}
              card-title="Files"
              frame-height="600"
            ></c-egnyte-vf-embed>
          </div>
        </div>

        <div class="arc-product-detail__side">
          <details class="product-section" open>
            <summary class="product-section__summary">Sponsor Information</summary>
            <div class="product-section__body">
              <lightning-record-form
                record-id={recordId}
                object-api-name={objectApiName}
                fields={sponsorInfoFields}
                columns="1"
                density="comfy"
                mode="readonly"
              ></lightning-record-form>
            </div>
          </details>

          <!-- Analyst Notes only -- Internal Notes is gated to the Due
               Diligence permission on the internal page and is not
               advisor-facing. -->
          <details class="product-section" open>
            <summary class="product-section__summary">Notes</summary>
            <div class="product-section__body">
              <lightning-record-form
                record-id={recordId}
                object-api-name={objectApiName}
                fields={notesFields}
                columns="1"
                density="comfy"
                mode="readonly"
              ></lightning-record-form>
            </div>
          </details>

          <article class="arc-product-detail__history-card">
            <header class="arc-product-detail__history-card-header">
              <h2 class="arc-product-detail__history-card-title">History</h2>
              <span class="arc-product-detail__history-card-count"
                >({historyCount})</span
              >
            </header>

            <template lwc:if={isHistoryLoading}>
              <div class="arc-product-detail__panel-loading">
                <lightning-spinner
                  alternative-text="Loading history"
                  size="small"
                ></lightning-spinner>
              </div>
            </template>

            <template lwc:if={historyError}>
              <p class="arc-product-detail__panel-error" role="alert">
                {historyError}
              </p>
            </template>

            <template lwc:if={hasHistory}>
              <ul class="arc-product-detail__history-rows">
                <template for:each={historyEntries} for:item="entry">
                  <li key={entry.id} class="arc-product-detail__history-row">
                    <dl class="arc-product-detail__history-fields">
                      <div class="arc-product-detail__history-field">
                        <dt>Date:</dt>
                        <dd>
                          <lightning-formatted-date-time
                            value={entry.createdDate}
                            year="numeric"
                            month="numeric"
                            day="numeric"
                            hour="2-digit"
                            minute="2-digit"
                          ></lightning-formatted-date-time>
                        </dd>
                      </div>
                      <div class="arc-product-detail__history-field">
                        <dt>Field:</dt>
                        <dd>{entry.fieldLabel}</dd>
                      </div>
                      <div class="arc-product-detail__history-field">
                        <dt>User:</dt>
                        <dd>{entry.actorName}</dd>
                      </div>
                      <div class="arc-product-detail__history-field">
                        <dt>Original Value:</dt>
                        <dd>{entry.oldValue}</dd>
                      </div>
                      <div class="arc-product-detail__history-field">
                        <dt>New Value:</dt>
                        <dd>{entry.newValue}</dd>
                      </div>
                    </dl>
                  </li>
                </template>
              </ul>

              <template lwc:if={historyHasMore}>
                <p class="arc-product-detail__panel-more">
                  Showing the first {historyCount}.
                </p>
              </template>
            </template>

            <template lwc:if={showHistoryEmpty}>
              <p class="arc-product-detail__panel-empty">
                No history on this record yet.
              </p>
            </template>
          </article>
        </div>
      </div>

      <c-arc-related-product-quick-view
        lwc:ref="relatedProductQuickView"
      ></c-arc-related-product-quick-view>
    </template>
  </div>
</template>
