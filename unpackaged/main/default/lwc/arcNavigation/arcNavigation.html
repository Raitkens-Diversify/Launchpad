<template>
  <nav class={navClass} aria-label="Site">
    <template for:each={menuItemsView} for:item="item">
      <div key={item.id} class={item.entryClass}>
        <template lwc:if={item.isDivider}>
          <div class="nav-divider" role="separator"></div>
        </template>
        <template lwc:elseif={item.renderCollapsedLink}>
          <!-- Anchors the flyout: the panel is a DOM child so that :hover
               stays true on the way from the icon across to the menu. -->
          <div
            class="nav-flyout-anchor"
            onmouseenter={handleFlyoutOpen}
            onfocusin={handleFlyoutOpen}
          >
            <a
              href={item.collapsedHref}
              class={item.linkClass}
              data-id={item.id}
              data-tour-id={item.id}
              data-group-id={item.collapsedGroupId}
              data-type={item.collapsedType}
              data-target={item.collapsedTarget}
              aria-current={item.ariaCurrent}
              title={item.itemTitle}
              onclick={handleClick}
            >
              <template lwc:if={item.hasIcon}>
                <span
                  class="nav-item__icon nav-item__icon--asset"
                  style={item.iconStyle}
                  aria-hidden="true"
                ></span>
              </template>
              <span class="nav-item__label nav-item__label--hidden"
                >{item.label}</span
              >
            </a>
            <template lwc:if={item.hasChildren}>
              <div class="nav-flyout" role="group" aria-label={item.label}>
                <p class="nav-flyout__title">{item.label}</p>
                <template for:each={item.subMenu} for:item="child">
                  <a
                    key={child.id}
                    href={child.href}
                    class={child.flyoutLinkClass}
                    data-id={child.id}
                    data-tour-id={child.id}
                    data-group-id={item.id}
                    data-type={child.type}
                    data-target={child.target}
                    aria-current={child.ariaCurrent}
                    onclick={handleClick}
                    >{child.label}</a
                  >
                </template>
              </div>
            </template>
          </div>
        </template>
        <template lwc:elseif={item.hasChildren}>
          <div class="nav-group">
            <template lwc:if={item.isCollapsible}>
              <button
                type="button"
                class="nav-group__header"
                data-id={item.id}
                data-tour-id={item.id}
                aria-expanded={item.isExpanded}
                aria-controls={item.panelId}
                aria-label={item.label}
                onclick={handleGroupToggle}
                onkeydown={handleGroupKeyDown}
              >
                <span class="nav-group__leading">
                  <template lwc:if={item.hasIcon}>
                    <span
                      class="nav-item__icon nav-item__icon--asset"
                      style={item.iconStyle}
                      aria-hidden="true"
                    ></span>
                  </template>
                  <span class="nav-group__title">{item.label}</span>
                  <template lwc:if={item.hasBadge}>
                    <span class="nav-item__badge">{item.badge}</span>
                  </template>
                </span>
                <!-- No data-tour-id here: the chevron shares the group's
                     data-id, and a second element under the same tour id would
                     make the walkthrough's target ambiguous. The group header
                     above is the element a tour step should point at. -->
                <span
                  class="nav-group__chevron-hitbox"
                  data-id={item.id}
                  onclick={handleChevronClick}
                >
                  <lightning-icon
                    icon-name={item.chevronIcon}
                    size="xx-small"
                    class="nav-group__chevron"
                    alternative-text={item.chevronLabel}
                  ></lightning-icon>
                </span>
              </button>
              <div
                class={item.childrenClass}
                id={item.panelId}
                aria-hidden={item.isCollapsed}
              >
                <template for:each={item.subMenu} for:item="child">
                  <a
                    key={child.id}
                    href={child.href}
                    class={child.linkClass}
                    data-id={child.id}
                    data-tour-id={child.id}
                    data-group-id={item.id}
                    data-type={child.type}
                    data-target={child.target}
                    aria-current={child.ariaCurrent}
                    onclick={handleClick}
                  >
                    {child.label}
                  </a>
                </template>
              </div>
            </template>
            <template lwc:else>
              <div class="nav-group__label">
                <template lwc:if={item.hasIcon}>
                  <span
                    class="nav-item__icon nav-item__icon--asset"
                    style={item.iconStyle}
                    aria-hidden="true"
                  ></span>
                </template>
                <span>{item.label}</span>
                <template lwc:if={item.hasBadge}>
                  <span class="nav-item__badge">{item.badge}</span>
                </template>
              </div>
              <div class="nav-group__children">
                <template for:each={item.subMenu} for:item="child">
                  <a
                    key={child.id}
                    href={child.href}
                    class={child.linkClass}
                    data-id={child.id}
                    data-tour-id={child.id}
                    data-type={child.type}
                    data-target={child.target}
                    aria-current={child.ariaCurrent}
                    onclick={handleClick}
                  >
                    {child.label}
                  </a>
                </template>
              </div>
            </template>
          </div>
        </template>
        <template lwc:else>
          <a
            href={item.href}
            class={item.linkClass}
            data-id={item.id}
            data-tour-id={item.id}
            data-type={item.type}
            data-target={item.target}
            aria-current={item.ariaCurrent}
            title={item.itemTitle}
            onclick={handleClick}
          >
            <template lwc:if={item.hasIcon}>
              <span
                class="nav-item__icon nav-item__icon--asset"
                style={item.iconStyle}
                aria-hidden="true"
              ></span>
            </template>
            <span class={item.labelClass}>{item.label}</span>
            <template lwc:if={item.hasBadge}>
              <span class="nav-item__badge">{item.badge}</span>
            </template>
          </a>
        </template>
      </div>
    </template>
    <div class="nav-footer">
      <div class="nav-footer__divider" role="separator"></div>
      <template lwc:if={sidebarCollapsed}>
        <img
          src={circleLogoUrl}
          width="126"
          height="126"
          class="nav-footer__logo nav-footer__logo--circle"
          alt="Diversify"
        />
      </template>
      <template lwc:else>
        <img
          src={builtByLogoUrl}
          width="1195"
          height="190"
          class="nav-footer__logo"
          alt="Built by Diversify"
        />
      </template>
    </div>
  </nav>
</template>
