<template>
    <div class="rdf">
        <template lwc:if={isTextInput}>
            <input
                class={inputClass}
                type={inputType}
                value={stringValue}
                placeholder={placeholder}
                maxlength={maxLength}
                min={minValue}
                max={maxValue}
                step={numberStep}
                pattern={pattern}
                disabled={isUnsupported}
                aria-label={ariaLabel}
                aria-invalid={hasValidationError}
                oninput={handleInputChange}
                onblur={handleBlur}>
        </template>

        <template lwc:elseif={isTextarea}>
            <textarea
                class={textareaClass}
                value={textareaValue}
                placeholder={placeholder}
                maxlength={maxLength}
                aria-label={ariaLabel}
                aria-invalid={hasValidationError}
                oninput={handleInputChange}
                onblur={handleBlur}>
            </textarea>
        </template>

        <template lwc:elseif={isPicklist}>
            <select
                class={selectClass}
                value={selectValue}
                aria-label={ariaLabel}
                aria-invalid={hasValidationError}
                onchange={handleSelectChange}
                onblur={handleBlur}>
                <option value="">Select...</option>
                <template for:each={picklistOptionsWithSelection} for:item="option">
                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                </template>
            </select>
        </template>

        <template lwc:elseif={isMultiPicklist}>
            <div class="rdf-multi" role="group" aria-label={ariaLabel}>
                <template for:each={multiPicklistOptions} for:item="option">
                    <label key={option.value} class="rdf-multi__item">
                        <input
                            class="rdf-multi__checkbox"
                            type="checkbox"
                            value={option.value}
                            checked={option.checked}
                            onchange={handleMultiChange}>
                        <span class="rdf-multi__label">{option.label}</span>
                    </label>
                </template>
            </div>
        </template>

        <template lwc:elseif={usesCustomSearch}>
            <div class="rdf-owner">
                <input
                    class={inputClass}
                    type="search"
                    placeholder={customSearchPlaceholder}
                    value={customSearchTerm}
                    aria-label={ariaLabel}
                    oninput={handleCustomSearch}>
                <template lwc:if={isCustomDropdownOpen}>
                    <div class="rdf-owner__dropdown" role="listbox">
                        <template for:each={customSearchResults} for:item="item">
                            <div
                                key={item.value}
                                class="rdf-owner__item"
                                role="option"
                                data-value={item.value}
                                data-label={item.label}
                                onclick={handleCustomSelect}>
                                <lightning-icon icon-name={item.icon} size="x-small"></lightning-icon>
                                <span>{item.label}</span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <template lwc:elseif={showReferencePicker}>
            <lightning-record-picker
                class={lookupClass}
                label={ariaLabel}
                variant="label-hidden"
                placeholder={lookupPlaceholder}
                object-api-name={referenceObjectApiName}
                value={referenceValue}
                disabled={readOnly}
                onchange={handleReferenceChange}>
            </lightning-record-picker>
        </template>

        <template lwc:elseif={isBoolean}>
            <label class="rdf-boolean">
                <input
                    class="rdf-checkbox"
                    type="checkbox"
                    checked={isChecked}
                    aria-label={ariaLabel}
                    onchange={handleCheckboxChange}>
            </label>
        </template>

        <template lwc:if={showValidationMessage}>
            <p class="div-field-error" role="alert">{validationMessage}</p>
        </template>
    </div>
</template>
