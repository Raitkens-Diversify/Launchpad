<template>
    <section class="egnyte-vf" aria-label={iframeTitle}>
        <!-- The header carries the actions as well as the title, so Approve is
             reachable without scrolling and without the component having to know
             whether it is needed — it cannot know, see the note in the .js. -->
        <header class="egnyte-vf__header">
            <h2 class="egnyte-vf__title">{cardTitle}</h2>
            <div class="egnyte-vf__actions">
                <button
                    type="button"
                    class="egnyte-vf__action"
                    title="Opens Egnyte on the Salesforce domain in a new tab, where the Approve link works. Approve there, then come back and reload."
                    onclick={handleApproveInNewTab}
                >
                    Approve access
                </button>
                <span class="egnyte-vf__action-divider" aria-hidden="true">•</span>
                <button
                    type="button"
                    class="egnyte-vf__action"
                    title="Reload Egnyte, for example after approving access"
                    onclick={handleReloadEgnyte}
                >
                    Reload
                </button>
            </div>
        </header>

        <div class="egnyte-vf__body">
            <template if:true={showOpenFullPageLink}>
                <template if:false={isPreviewHost}>
                    <div class="egnyte-vf__toolbar">
                        <a
                            class="egnyte-vf__open-link"
                            href={vfPageUrl}
                            onclick={handleOpenFullPage}
                            aria-label="Open Egnyte in full page"
                        >
                            Open in full page
                        </a>
                    </div>
                </template>
            </template>

            <template if:true={showPreviewFallback}>
                <div class="egnyte-vf__notice" role="region" aria-label="Egnyte preview placeholder">
                    <p class="egnyte-vf__notice-text">
                        Visualforce is not available in Experience Builder preview. Open Egnyte on the published site to test the full experience.
                    </p>
                    <lightning-button
                        label="Open Egnyte"
                        title="Open Egnyte on the published site in a new tab"
                        onclick={handleOpenEgnyteNewTab}
                    ></lightning-button>
                </div>
            </template>

            <template if:true={showStatusSpinner}>
                <div class="egnyte-vf__status">
                    <lightning-spinner alternative-text="Loading Egnyte" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:true={error}>
                <div class="egnyte-vf__error" role="alert">{error}</div>
            </template>

            <template if:true={showIframe}>
                <!-- allow-top-navigation-by-user-activation is what lets the
                     Approve link inside the canvas app leave the frame; sandbox
                     flags are inherited by nested frames, and without it the
                     browser refuses the navigation silently. -->
                <iframe
                    allowtransparency="true"
                    frameborder="0"
                    class="egnyte-vf__frame"
                    src={vfPageUrl}
                    title={iframeTitle}
                    style={iframeStyle}
                    sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads allow-top-navigation-by-user-activation"
                    onload={handleIframeLoad}
                    onerror={handleIframeError}
                ></iframe>
            </template>
        </div>
    </section>
</template>
