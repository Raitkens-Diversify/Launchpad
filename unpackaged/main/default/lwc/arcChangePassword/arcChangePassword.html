<template>
  <div class="password-settings">
    <template lwc:if={errorMessage}>
      <p class="password-settings__error" role="alert">{errorMessage}</p>
    </template>

    <div class="password-settings__form">
      <template for:each={rows} for:item="row">
        <div key={row.key} class="password-settings__row">
          <div class="password-settings__label">
            <span class="password-settings__label-text">{row.label}</span>
            <span class="password-settings__label-help">{row.help}</span>
          </div>
          <div class="password-settings__field">
            <div class="password-settings__input-wrap">
              <input
                class="password-settings__input"
                type={row.type}
                value={row.value}
                data-field={row.key}
                aria-label={row.label}
                autocomplete={row.autocomplete}
                spellcheck="false"
                oninput={handleInput}
              />
              <button
                class="password-settings__reveal"
                type="button"
                data-field={row.key}
                aria-label={row.toggleLabel}
                onclick={handleToggleReveal}
              >
                {row.toggleText}
              </button>
            </div>
          </div>
        </div>
      </template>
    </div>

    <ul class="password-settings__requirements" aria-live="polite">
      <template for:each={requirements} for:item="requirement">
        <li key={requirement.key} class={requirement.itemClass}>
          <lightning-icon
            icon-name={requirement.iconName}
            size="xx-small"
            alternative-text={requirement.status}
          ></lightning-icon>
          <span>{requirement.label}</span>
        </li>
      </template>
    </ul>

    <footer class="password-settings__footer">
      <button
        type="button"
        class="password-settings__button"
        disabled={isResetDisabled}
        onclick={handleReset}
      >
        Cancel
      </button>
      <button
        type="button"
        class="password-settings__button password-settings__button--brand"
        disabled={isSubmitDisabled}
        onclick={handleSubmit}
      >
        {submitLabel}
      </button>
    </footer>
  </div>
</template>
