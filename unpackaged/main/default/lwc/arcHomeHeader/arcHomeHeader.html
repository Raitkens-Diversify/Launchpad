<template>
  <header class="arc-home-header" aria-label="Home page header">
    <div class="arc-home-header__copy">
      <h1 class="arc-home-header__title">{welcomeTitle}</h1>
      <p class="arc-home-header__date">{formattedDate}</p>
    </div>

    <div
      class="arc-home-header__actions"
      role="group"
      aria-label="Quick actions"
    >
      <template for:each={actionButtons} for:item="action">
        <button
          key={action.key}
          type="button"
          class="arc-home-header__action"
          data-action={action.key}
          aria-label={action.label}
          onclick={handleActionClick}
          onkeydown={handleActionKeyDown}
        >
          {action.label}
        </button>
      </template>
    </div>
  </header>

  <!-- New Advertising Request and Log a Check both run their launchpad
       experiences as ARC-site flow copies inside this dialog. Mounted only on
       demand: the flow runtime injects global styling hooks document-wide,
       which would repaint other components' slds-g fallbacks on page load. -->
  <template lwc:if={flowModalMounted}>
    <c-arc-flow-modal lwc:ref="homeFlowModal"></c-arc-flow-modal>
  </template>
</template>
