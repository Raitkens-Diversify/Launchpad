<template>
  <div class="record-section">
    <template lwc:if={isSaving}>
      <div class="record-section__saving" role="status" aria-live="polite">
        <c-arc-loading-spinner
          alternative-text="Saving changes"
          size="small"
        ></c-arc-loading-spinner>
      </div>
    </template>
    <template lwc:if={showHeader}>
      <header class="record-section__header">
        <div class="record-section__heading">
          <h3 class="record-section__title">{label}</h3>
          <span
            class="record-section__title-info"
            title={label}
            aria-hidden="true"
          ></span>
        </div>
        <template lwc:if={showEditButton}>
          <button
            type="button"
            class="record-section__edit"
            aria-label={editAriaLabel}
            onclick={handleEditClick}
          >
            <span class="record-section__edit-icon" aria-hidden="true"></span>
            <span class="record-section__edit-label">Edit</span>
          </button>
        </template>
        <template lwc:elseif={showSectionActions}>
          <div class="record-section__actions">
            <lightning-button
              label="Cancel"
              variant="neutral"
              disabled={isCancelDisabled}
              onclick={handleCancelClick}
            >
            </lightning-button>
            <lightning-button
              label="Save"
              variant="brand"
              disabled={isSaveDisabled}
              onclick={handleSaveClick}
            >
            </lightning-button>
          </div>
        </template>
      </header>
    </template>
    <template lwc:if={showRegulatedAlert}>
      <div class="record-section__alert" role="status">
        <span class="record-section__alert-icon" aria-hidden="true"></span>
        <p class="record-section__alert-text">
          Regulated fields cannot be edited. In order to make changes, you will
          need to create an envelope, make edits and submit the envelope to home
          office.
        </p>
        <button
          type="button"
          class="record-section__alert-action"
          onclick={handleCreateEnvelope}
        >
          Create Envelope
        </button>
      </div>
    </template>
    <div class={fieldsClass}>
      <template for:each={fieldRows} for:item="field">
        <div key={field.key} class={field.rowClass}>
          <div class="field-row__label">
            <div class="field-row__label-heading">
              <span class="field-row__label-text">{field.displayLabel}</span>
              <template lwc:if={field.isRegulated}>
                <span
                  class="field-row__lock"
                  title="Controlled by the home office"
                  aria-label="Controlled by the home office"
                ></span>
              </template>
            </div>
            <template lwc:if={field.showRegulatedBadge}>
              <span class="field-row__badge">
                <span class="field-row__badge-icon" aria-hidden="true"></span>
                Regulated by Home Office
              </span>
            </template>
          </div>
          <div class="field-row__control">
            <template lwc:if={field.showPlainValue}>
              <span class={field.valueClass}>{field.displayValue}</span>
            </template>
            <template lwc:if={field.showLink}>
              <span class={field.valueClass}>
                <a
                  class="field-row__link"
                  href={field.href}
                  data-field-key={field.key}
                  onclick={handleLinkClick}
                  >{field.displayValue}</a
                >
              </span>
            </template>
            <template lwc:if={field.showControl}>
              <c-arc-record-detail-field
                field={field}
                data-field={field.apiName}
                onvaluechange={handleFieldChange}
              >
              </c-arc-record-detail-field>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>
</template>
