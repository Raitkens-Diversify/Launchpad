<template>
  <div>
    <!-- No slds-card_boundary / slds-theme_shade on the host: the host box
         renders inline and taller than the inner article, so its own border
         drew stray line fragments above and below the card. The inner
         slds-card article already carries the card border. -->
    <lightning-card icon-name="utility:comments">
      <span slot="title">
        <b>
          <a class="slds-card__header-link">
            {sobjectLabelPlural} ({dataCount})
          </a>
        </b>
      </span>
      <template if:true={showData}>
        <div>
          <lightning-datatable
            key-field="Id"
            data={displayedData}
            columns={columns}
            hide-checkbox-column
          >
          </lightning-datatable>
        </div>

        <!-- View All / View Less toggle -->
        <div
          class="linkText slds-p-horizontal slds-text-align_center"
          onclick={toggleViewAll}
        >
          {viewMinMax}
        </div>
      </template>

      <!-- Empty state: the card is otherwise just a header, whose border reads
           as a stray line. A muted message fills it out, matching the other
           related lists' "No ..." copy. -->
      <template if:false={showData}>
        <div class="task-comment__empty">No comments yet.</div>
      </template>
    </lightning-card>
  </div>
</template>
