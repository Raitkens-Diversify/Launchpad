<template>
  <div>
    <lightning-card
      class="slds-theme_shade slds-card_boundary"
      icon-name="utility:comments"
    >
      <span slot="title">
        <b>
          <a class="slds-card__header-link">
            {sobjectLabelPlural} ({dataCount})
          </a>
        </b>
      </span>
      <template if:true={showData}>
        <div>
          <lightning-datatable
            key-field="Id"
            data={displayedData}
            columns={columns}
            hide-checkbox-column
          >
          </lightning-datatable>
        </div>

        <!-- View All / View Less toggle -->
        <div
          class="linkText slds-p-horizontal slds-text-align_center"
          onclick={toggleViewAll}
        >
          {viewMinMax}
        </div>
      </template>

      <!-- Empty state: the card is otherwise just a header, whose border reads
           as a stray line. A muted message fills it out, matching the other
           related lists' "No ..." copy. -->
      <template if:false={showData}>
        <div class="task-comment__empty">No comments yet.</div>
      </template>
    </lightning-card>
  </div>
</template>
