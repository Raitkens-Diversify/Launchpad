<template>
    <lightning-card title="Main Track Tasks">
        <!-- lightning-card puts the actions slot in the header, top
             right. Reloads only this tile. -->
        <lightning-button-icon
            slot="actions"
            icon-name="utility:refresh"
            variant="border-filled"
            alternative-text="Refresh main track tasks"
            title="Refresh"
            disabled={isRefreshing}
            onclick={handleRefresh}
        ></lightning-button-icon>
        <template lwc:if={hasTasks}>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col" style="width: 40%;">
                            <div class="slds-truncate">Subject</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate">Status</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate">Owner</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate">Completed Date</div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={tasks} for:item="task">
                        <tr key={task.Id}>
                            <td class="slds-truncate">
                                <div class="slds-grid" style="width:250px">
                                    <div class="slds-grid slds-has-flexi-truncate">
                                        <a  class="slds-truncate"
                                            href="javascript:void(0);"
                                            data-taskid={task.Id}
                                            data-tasksub={task.Subject}
                                            onclick={navigateToTask}>
                                            {task.Subject}
                                        </a>
                                    </div>
                                </div>
                            </td>
                            <td>{task.Status}</td>
                            <td>{task.Owner.Name}</td>
                            <td>{task.Completed_Date__c}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
        <template lwc:else>
            <div class="slds-p-around_medium">No Tasks Found.</div>
        </template>
    </lightning-card>
</template>
