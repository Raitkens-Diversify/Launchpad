<template>
  <div class="arc-household-detail">
    <template lwc:if={showTitle}>
      <h2 class="arc-household-detail__title">{cardTitle}</h2>
    </template>

    <template lwc:if={isLoading}>
      <div class="arc-household-detail__loading">
        <c-arc-loading-spinner
          alternative-text="Loading household details"
          size="small"
        ></c-arc-loading-spinner>
      </div>
    </template>

    <template lwc:if={errorMessage}>
      <p class="arc-household-detail__error" role="alert">{errorMessage}</p>
    </template>

    <template lwc:if={hasSections}>
      <!-- The Details sections are shown as a tab bar rather than a stack of
           cards, matching the Lightning record page: one section on screen at a
           time instead of a long scroll. Which tabs appear is decided upstream
           in `sections` -- a section is present only when it carries fields for
           this account's record type, so the tab set differs per account
           exactly as the Lightning page's component visibility makes it.

           An inline tablist, not c-ds-tabs: these tabs can be many and their
           names long (e.g. "Industry & Other Affiliations"), so the strip has
           to scroll sideways when it overflows, which needs control over the
           flex row that a shared component does not expose. -->
      <div class="arc-household-detail__card">
        <div
          class="arc-household-detail__tabs"
          role="tablist"
          aria-label="Details sections"
        >
          <template for:each={tabItems} for:item="tab">
            <button
              key={tab.key}
              type="button"
              role="tab"
              class={tab.cssClass}
              aria-selected={tab.ariaSelected}
              tabindex={tab.tabIndex}
              data-key={tab.key}
              onclick={handleTabClick}
              onkeydown={handleTabKeydown}
            >
              {tab.label}
            </button>
          </template>
        </div>

        <!-- Field-section tabs. Every section's panel is rendered and stacked in
             one grid cell (see the CSS): only the active one is visible, but the
             inactive ones keep their space, so the card is always as tall as the
             TALLEST section. Switching between these tabs therefore never resizes
             the card, which had been nudging the Documents section below it up
             and down. Relationships is a different kind of content and gets its
             own panel below rather than being force-fit to the field height. -->
        <template lwc:if={isFieldTabActive}>
          <div class="arc-household-detail__panels">
            <template for:each={panelSections} for:item="section">
              <div
                key={section.key}
                class={section.panelClass}
                role="tabpanel"
                aria-label={section.name}
                aria-hidden={section.hiddenAttr}
              >
                <dl class="arc-household-detail__grid">
                  <template for:each={section.fields} for:item="field">
                    <div key={field.key} class="arc-household-detail__field">
                      <dt class="arc-household-detail__label">{field.label}</dt>
                      <dd class={field.valueClass}>{field.value}</dd>
                    </div>
                  </template>
                </dl>
              </div>
            </template>
          </div>
        </template>

        <!-- Relationships tab: the account's related-people card, moved off the
             right rail into the strip. It brings its own heading and layout. -->
        <template lwc:if={isRelationshipsActive}>
          <div
            class="arc-household-detail__relationships-panel"
            role="tabpanel"
            aria-label="Relationships"
          >
            <c-arc-account-relationships
              card-title="Relationships"
            ></c-arc-account-relationships>
          </div>
        </template>
      </div>
    </template>

    <template lwc:if={showEmpty}>
      <p class="arc-household-detail__empty">
        No details are configured for this record.
      </p>
    </template>
  </div>
</template>
