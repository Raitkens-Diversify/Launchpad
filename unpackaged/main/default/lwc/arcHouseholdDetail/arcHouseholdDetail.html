<template>
  <div class="arc-household-detail">
    <template lwc:if={showTitle}>
      <h2 class="arc-household-detail__title">{cardTitle}</h2>
    </template>

    <template lwc:if={showTabs}>
      <div class="arc-household-detail__card">
        <div
          class="arc-household-detail__tabs"
          role="tablist"
          aria-label="Contact details"
        >
          <template for:each={tabItems} for:item="tab">
            <button
              key={tab.key}
              type="button"
              role="tab"
              class={tab.cssClass}
              aria-selected={tab.ariaSelected}
              tabindex={tab.tabIndex}
              data-key={tab.key}
              onclick={handleTabClick}
              onkeydown={handleTabKeydown}
            >
              {tab.label}
            </button>
          </template>
        </div>

        <!-- Details: every field section stacked together under one tab,
             each with its own heading, rather than one section at a time. -->
        <template lwc:if={isDetailsActive}>
          <div class="arc-household-detail__panel" role="tabpanel" aria-label="Details">
            <template lwc:if={isLoading}>
              <div class="arc-household-detail__loading">
                <c-arc-loading-spinner
                  alternative-text="Loading details"
                  size="small"
                ></c-arc-loading-spinner>
              </div>
            </template>

            <template lwc:if={errorMessage}>
              <p class="arc-household-detail__error" role="alert">{errorMessage}</p>
            </template>

            <template for:each={sections} for:item="section">
              <div key={section.key} class="arc-household-detail__section">
                <h3 class="arc-household-detail__section-heading">{section.name}</h3>
                <dl class="arc-household-detail__grid">
                  <template for:each={section.fields} for:item="field">
                    <div key={field.key} class="arc-household-detail__field">
                      <dt class="arc-household-detail__label">{field.label}</dt>
                      <dd class={field.valueClass}>{field.value}</dd>
                    </div>
                  </template>
                </dl>
              </div>
            </template>

            <template lwc:if={showDetailsEmpty}>
              <p class="arc-household-detail__empty">
                No details are configured for this record.
              </p>
            </template>
          </div>
        </template>

        <!-- Cases: every Case linked to this record, directly or through its
             household -- see arcAccountCasesList. -->
        <template lwc:if={isCasesActive}>
          <div class="arc-household-detail__panel" role="tabpanel" aria-label="Cases">
            <c-arc-account-cases-list></c-arc-account-cases-list>
          </div>
        </template>

        <!-- Relationships: the account's related-people card, unchanged --
             just relocated under this tab. -->
        <template lwc:if={isRelationshipsActive}>
          <div
            class="arc-household-detail__relationships-panel"
            role="tabpanel"
            aria-label="Relationships"
          >
            <c-arc-account-relationships
              card-title="Relationships"
            ></c-arc-account-relationships>
          </div>
        </template>

        <!-- Documents: the Egnyte embed, unchanged -- moved here from its own
             page-level placement below this component. -->
        <template lwc:if={isDocumentsActive}>
          <div class="arc-household-detail__panel" role="tabpanel" aria-label="Documents">
            <c-egnyte-vf-embed domain={domain}></c-egnyte-vf-embed>
          </div>
        </template>

        <!-- Investments & Services: every ISA, Service, and Approved Product
             tied to this record -- see arcAccountInvestmentsList. -->
        <template lwc:if={isInvestmentsActive}>
          <div
            class="arc-household-detail__panel"
            role="tabpanel"
            aria-label="Investments & Services"
          >
            <c-arc-account-investments-list></c-arc-account-investments-list>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>
