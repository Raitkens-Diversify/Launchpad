<template>
    <div class="ds-ring" role="progressbar"
         aria-label={ariaLabelText}
         aria-valuenow={pct} aria-valuemin="0" aria-valuemax="100">
        <svg class="ds-ring__svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
            <circle class="ds-ring__track" cx="50" cy="50" r="44" pathLength="100"></circle>
            <circle class="ds-ring__value" cx="50" cy="50" r="44" pathLength="100"
                    style={dashStyle}></circle>
        </svg>
        <div class="ds-ring__center" aria-hidden="true">
            <span class="ds-ring__pct">{pctLabel}</span>
            <template if:true={label}>
                <span class="ds-ring__label">{label}</span>
            </template>
        </div>
    </div>
</template>
