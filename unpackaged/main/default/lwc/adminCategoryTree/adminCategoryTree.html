<template>
    <template if:true={isEmpty}>
        <p class="act-empty">No categories found.</p>
    </template>
    <ul class="act-list">
        <template for:each={viewNodes} for:item="row">
            <li key={row.name} data-level={row.level}>
                <label class={row.cssClass} style={row.style}>
                    <input type="checkbox"
                           data-name={row.name}
                           checked={row.checked}
                           onchange={handleToggle} />
                    <span class={row.labelClass}>{row.label}</span>
                </label>
            </li>
        </template>
    </ul>
</template>
