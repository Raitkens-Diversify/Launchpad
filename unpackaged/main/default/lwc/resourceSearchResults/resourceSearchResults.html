<template>
    <div class="rsr">
        <h1 class="rsr__title">Results for &ldquo;{term}&rdquo;</h1>

        <template if:true={showFuzzy}>
            <p class="rsr__notice">Showing results for &ldquo;{meta.corrected}&rdquo;.</p>
        </template>

        <template if:true={loading}>
            <div class="rsr__status">
                <lightning-spinner alternative-text="Searching" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasArticles}>
            <section class="rsr__section">
                <p class="rsr__label">Help Center Articles</p>
                <div class="rsr__grid" oncontentselect={handleContentSelect}>
                    <template for:each={articleItems} for:item="item">
                        <c-ds-content-card key={item.id} item={item}></c-ds-content-card>
                    </template>
                </div>
            </section>
        </template>
        <template if:true={articlesDegraded}>
            <p class="rsr__status">Help Center articles couldn&rsquo;t be searched right now.</p>
        </template>

        <template if:true={hasResources}>
            <section class="rsr__section">
                <p class="rsr__label">Resources</p>
                <div class="rsr__grid" oncontentselect={handleContentSelect}>
                    <template for:each={resourceItems} for:item="item">
                        <c-ds-content-card key={item.id} item={item}></c-ds-content-card>
                    </template>
                </div>
            </section>
        </template>
        <template if:true={resourcesDegraded}>
            <p class="rsr__status">Resources couldn&rsquo;t be searched right now.</p>
        </template>

        <template if:true={isEmpty}>
            <p class="rsr__status">No resources or articles matched your search.</p>
        </template>
    </div>
</template>
