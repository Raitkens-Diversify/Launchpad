<template>
    <div class="aae">
        <div class="aae__bar">
            <lightning-button-icon icon-name="utility:back"
                                   alternative-text="Back to articles"
                                   onclick={handleBack}></lightning-button-icon>
            <div class="aae__bar-text">
                <h2 class="aae__title">{headerTitle}</h2>
                <p class="aae__status">{statusNote}</p>
            </div>
            <div class="aae__bar-actions">
                <lightning-button label="Save Draft"
                                  onclick={handleSaveDraft}
                                  disabled={busy}></lightning-button>
                <lightning-button variant="brand"
                                  label={publishLabel}
                                  onclick={handlePublish}
                                  disabled={busy}></lightning-button>
            </div>
        </div>

        <template if:true={errorMessage}>
            <p class="aae__error" role="alert">{errorMessage}</p>
        </template>

        <template if:true={loading}>
            <div class="aae__loading">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:false={loading}>
            <div class="aae__grid">
                <div class="aae__col">
                    <section class="aae__card">
                        <h3 class="aae__card-title">Basics</h3>
                        <lightning-combobox label="Article type"
                                            value={recordTypeId}
                                            options={recordTypeOptions}
                                            onchange={handleRecordTypeChange}></lightning-combobox>
                        <template if:true={recordTypeDescription}>
                            <p class="aae__help">{recordTypeDescription}</p>
                        </template>
                        <lightning-input label="Title"
                                         value={title}
                                         required
                                         max-length="255"
                                         onchange={handleTitleChange}></lightning-input>
                        <lightning-input label="URL Name"
                                         field-level-help="Becomes the article's link (…/article/your-url-name). Auto-suggested from the title; lowercase letters, numbers, and dashes only."
                                         value={urlName}
                                         required
                                         max-length="255"
                                         onchange={handleUrlNameChange}
                                         onblur={handleUrlNameBlur}></lightning-input>
                        <template if:true={urlNameError}>
                            <p class="aae__field-error">{urlNameError}</p>
                        </template>
                        <lightning-textarea label="Summary"
                                            field-level-help="Shown in search results and article lists. One or two plain sentences."
                                            value={summary}
                                            max-length="1000"
                                            onchange={handleSummaryChange}></lightning-textarea>
                    </section>

                    <section class="aae__card">
                        <h3 class="aae__card-title">Content</h3>
                        <p class="aae__help">
                            The article body. Use headings to structure it — articles with two
                            or more headings get an automatic “In this article” outline. Don’t
                            paste iframes or embed codes here; they’re stripped on display —
                            use the Embed URL field below instead.
                        </p>
                        <lightning-input-rich-text value={content}
                                                   label="Article body"
                                                   label-visible
                                                   onchange={handleContentChange}></lightning-input-rich-text>
                        <template if:true={isFaq}>
                            <p class="aae__help aae__help--spaced">
                                FAQ extras: Question and Answer boost this article in search when
                                someone types a matching question. <strong>They are never shown to
                                readers</strong> — the body above is what displays.
                            </p>
                            <lightning-input-rich-text value={question}
                                                       label="Question (search-only)"
                                                       label-visible
                                                       onchange={handleQuestionChange}></lightning-input-rich-text>
                            <lightning-input-rich-text value={answer}
                                                       label="Answer (search-only)"
                                                       label-visible
                                                       onchange={handleAnswerChange}></lightning-input-rich-text>
                        </template>
                        <lightning-input label="Embed URL (optional)"
                                         field-level-help="Paste an https:// embed link (e.g. a Scribe share link). It renders as an interactive frame below the article body."
                                         value={embedUrl}
                                         type="url"
                                         onchange={handleEmbedUrlChange}></lightning-input>
                    </section>

                    <section class="aae__card">
                        <h3 class="aae__card-title">Discovery</h3>
                        <lightning-textarea label="Keywords"
                                            field-level-help="Comma- or space-separated words that boost this article in search — weighted just below the title. Never shown to readers."
                                            value={keywords}
                                            onchange={handleKeywordsChange}></lightning-textarea>
                        <lightning-input type="checkbox"
                                         label="Featured"
                                         field-level-help="Pins this article first within its help topic and gives it a small search boost."
                                         checked={featured}
                                         onchange={handleFeaturedChange}></lightning-input>
                        <c-admin-related-linker search-type="articles"
                                                label="Suggested articles (optional)"
                                                placeholder="Search published articles…"
                                                items={suggestedItems}
                                                onitemschange={handleSuggestedChange}></c-admin-related-linker>
                        <p class="aae__help">
                            Curates the “Suggested” rail next to this article, in this order.
                            Left empty, the rail fills automatically with same-topic articles.
                        </p>
                    </section>
                </div>

                <div class="aae__col aae__col--side">
                    <section class="aae__card">
                        <h3 class="aae__card-title">Help topics</h3>
                        <p class="aae__help">
                            Where this article lives in the Help Center — pick the topic
                            section(s) it should appear under. Most articles belong to exactly
                            one subtopic.
                        </p>
                        <c-admin-category-tree nodes={categoryTree}
                                               selected={categoryNames}
                                               mode="multi"
                                               onselectionchange={handleCategoryChange}></c-admin-category-tree>
                    </section>

                    <section class="aae__card">
                        <h3 class="aae__card-title">Related resources</h3>
                        <p class="aae__help">
                            Attached resources appear in the rail next to this article, under
                            Suggested Articles. To link a word <em>inside</em> the article
                            instead: copy a resource's link (the link icon below, or from the
                            Resources list), select the text in the body, and use the editor's
                            link tool.
                        </p>
                        <c-admin-related-linker search-type="resources"
                                                label="Attached resources"
                                                placeholder="Search resources…"
                                                items={resourceItems}
                                                copy-link-base={resourceLinkBase}
                                                onitemschange={handleResourcesChange}></c-admin-related-linker>
                    </section>
                </div>
            </div>
        </template>
    </div>
</template>
