<template>
  <!--
    Never rendered ({bundleFlowScreens} is always false). These are the flow
    screen components the site's flows load by extensionName, which the LWR
    site compiler cannot see — so on the published site they 404 (LWR3008)
    unless something the compiler DOES reach references them statically. This
    dialog is always in the bundle (arcCaseDetail / arcHomeHeader /
    arcRecordListView reference it), so naming them here pulls them in.
  -->
  <template lwc:if={bundleFlowScreens}>
    <c-arc-flow-lookup></c-arc-flow-lookup>
    <c-arc-flow-file-upload></c-arc-flow-file-upload>
    <c-arc-flow-file-upload-ad></c-arc-flow-file-upload-ad>
    <c-arc-flow-stylized-button></c-arc-flow-stylized-button>
    <c-arc-flow-cost-line-items></c-arc-flow-cost-line-items>
  </template>

  <template lwc:if={isOpen}>
    <section
      class={overlayClass}
      role="dialog"
      aria-modal="true"
      aria-label={dialogLabel}
    >
      <div class="arc-flow-modal__backdrop" onclick={handleBackdropClick}></div>

      <div class={panelClass}>
        <header class="arc-flow-modal__header">
          <div class="arc-flow-modal__intro">
            <h2 class="arc-flow-modal__title">{title}</h2>
            <template lwc:if={hasSubtitle}>
              <p class="arc-flow-modal__subtitle">{subtitle}</p>
            </template>
          </div>
          <button
            type="button"
            class="arc-flow-modal__close"
            title="Cancel"
            aria-label="Cancel"
            onclick={handleCancel}
          >
            <lightning-icon
              icon-name="utility:close"
              size="x-small"
              alternative-text="Cancel"
            ></lightning-icon>
          </button>
        </header>

        <div class="arc-flow-modal__body">
          <template lwc:if={showFlow}>
            <lightning-flow
              key={flowKey}
              flow-api-name={flowName}
              flow-input-variables={flowInputVariables}
              onstatuschange={handleFlowStatusChange}
            ></lightning-flow>
          </template>
        </div>

        <!--
          Only rendered once the flow is done. While it is running the flow draws
          its own footer holding its own navigation buttons, and adding a second
          strip below it put two footers on the dialog with a lone Cancel
          stranded in the lower one. Cancelling mid-flow is the header's X.
        -->
        <template lwc:if={isFlowFinished}>
          <footer class="arc-flow-modal__footer">
            <lightning-button
              variant="brand"
              label="Close"
              onclick={handleClose}
            ></lightning-button>
          </footer>
        </template>
      </div>
    </section>
  </template>
</template>
