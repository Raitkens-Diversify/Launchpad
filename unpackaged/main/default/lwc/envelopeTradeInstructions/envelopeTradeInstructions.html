<!-- Author: Mile Cacanovic -->
<template>
    <div class="trade">
        <!-- Every entry point captures an account value: each allocation row shows both a weight and
             a dollar figure, and neither can be calculated from the other without one. Left empty, the
             section falls back to the value already captured elsewhere in the interview, offered here
             as the placeholder rather than pre-filled — an inherited number must stay visibly
             inherited. -->
        <div class="trade__block trade__block_expected">
            <!-- No currency formatter, deliberately: a formatter rewrites whatever it is handed,
                 so the input could never be bound the exact value it just reported — and that
                 equality is what keeps this controlled field from echoing itself into a loop. The
                 formatted figure is the footer ledger's first line, immediately below. -->
            <lightning-input
                type="number"
                step="0.01"
                label="Expected Account Value"
                value={expectedAccountValue}
                placeholder={expectedPlaceholder}
                onchange={handleExpectedChange}
                onblur={handleExpectedBlur}>
            </lightning-input>
        </div>

        <div class="trade__block trade__block_strategy">
            <c-envelope-strategy-list
                lwc:ref="table"
                strategies={rows}
                options={pickerOptions}
                allocation-base={allocationBase}
                onstrategieschange={handleRowsChange}>
            </c-envelope-strategy-list>

            <!-- The ledger, shown instead of described: account value, minus what the sleeves
                 allocate, minus any excluded sleeves, equals the remaining balance — zero when the
                 account is fully allocated. -->
            <template lwc:if={showFooter}>
                <div class="trade__footer">
                    <template lwc:if={showDollarMath}>
                        <div class="trade__footer-line">
                            <span>Account value</span>
                            <span class="trade__footer-figure">{accountValueDisplay}</span>
                        </div>
                        <!-- Says where the figure came from when it was inherited rather than typed.
                             The amount itself is the ledger line directly above and the input that
                             overrides it is directly above that, so naming either again would only
                             restate the layout. -->
                        <template lwc:if={usingFallback}>
                            <p class="trade__footer-hint">Inherited from Source of Funds.</p>
                        </template>
                        <!-- The subtraction reads straight down the page, in the order it happens:
                             excluded sleeves come off the account value first, leaving the base
                             every target weight is a share of, and the model rows then draw that
                             base down to nothing. The Excluded and "Left to allocate" lines appear
                             only when something is actually excluded — with no exception sleeve the
                             base equals the account value directly above it, and restating the same
                             figure would read as an error rather than as a step. -->
                        <template lwc:if={showLedgerLines}>
                            <template lwc:if={showExcludedLine}>
                                <div class="trade__footer-line">
                                    <span>Excluded</span>
                                    <span class="trade__footer-figure">{excludedDisplay}</span>
                                </div>
                            </template>
                            <template lwc:if={showModelBaseLine}>
                                <div class="trade__footer-line trade__footer-line_subtotal">
                                    <span>Left to allocate</span>
                                    <span class="trade__footer-figure">{modelBaseDisplay}</span>
                                </div>
                            </template>
                            <template lwc:if={showAllocatedLine}>
                                <div class="trade__footer-line">
                                    <span>Allocated</span>
                                    <span class="trade__footer-figure">{allocatedDisplay}</span>
                                </div>
                            </template>
                            <div class="trade__footer-line trade__footer-line_total">
                                <span>Remaining balance</span>
                                <span class="trade__footer-figure">{remainingDisplay}</span>
                            </div>
                        </template>
                    </template>
                    <template lwc:if={showEnterValueHint}>
                        <p class="trade__footer-hint">
                            Enter the expected account value to see dollar amounts.
                        </p>
                    </template>
                </div>
            </template>

            <!-- Always-present live region so status changes are announced as the numbers move. -->
            <div class="trade__status" aria-live="polite">
                <template lwc:if={allocationStatusText}>
                    <p class={allocationStatusClass}>{allocationStatusText}</p>
                </template>
                <template lwc:if={showOverFundedWarning}>
                    <p class="trade__warning">{overFundedMessage}</p>
                </template>
            </div>
        </div>

        <div class="trade__block trade__block_notes">
            <lightning-textarea
                label="Advisor Notes Related to Trade"
                value={advisorNotes}
                onchange={handleNotesChange}
                onblur={handleNotesBlur}>
            </lightning-textarea>
        </div>
    </div>
</template>
