<template>
  <span class={wrapperClass}>
    <button
      type="button"
      class="nav-toggle"
      aria-label={toggleLabel}
      aria-describedby="arc-nav-toggle-tooltip"
      aria-pressed={collapsed}
      aria-disabled={isToggleDisabled}
      disabled={isToggleDisabled}
      onclick={handleToggleClick}
      onkeydown={handleToggleKeyDown}
    >
      <span
        class="nav-toggle__icon"
        style={iconStyle}
        aria-hidden="true"
      ></span>
    </button>
    <span id="arc-nav-toggle-tooltip" class="nav-toggle-tooltip" role="tooltip"
      >{tooltipLabel}
      <template lwc:if={showShortcutHint}>
        <span class="nav-toggle-tooltip__shortcut">⌘.</span>
      </template></span
    >
  </span>
</template>
