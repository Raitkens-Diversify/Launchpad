<template>
    <template if:true={hasResources}>
        <section class="ar-card" aria-label="Downloads and resources">
            <h2 class="ar-card__title">Downloads &amp; Resources</h2>
            <ul class="ar-list">
                <template for:each={rows} for:item="row">
                    <li key={row.id} class="ar-row">
                        <span class="ar-row__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round"
                                 stroke-linejoin="round" focusable="false">
                                <path d={row.iconPath}></path>
                            </svg>
                        </span>
                        <span class="ar-row__name">{row.name}</span>
                        <!-- Two anchors, not one with download={row.download}: LWC
                             renders a false binding as download="false", and ANY
                             download attribute makes the browser save the target —
                             in the core app that saved the Resource Center tab's
                             page as an .htm (2026-09-08). Only the direct-download
                             fallback row carries the attribute. -->
                        <template if:true={row.href}>
                            <template if:true={row.download}>
                                <a class="ar-row__link" href={row.href} target={row.target}
                                   download data-id={row.id} data-track={row.trackClick}
                                   data-slug={row.slug} data-detail={row.isDetail}
                                   data-content-document-id={row.contentDocumentId}
                                   onclick={handleLinkClick}>{row.action}</a>
                            </template>
                            <template if:false={row.download}>
                                <a class="ar-row__link" href={row.href} target={row.target}
                                   data-id={row.id} data-track={row.trackClick}
                                   data-slug={row.slug} data-detail={row.isDetail}
                                   data-content-document-id={row.contentDocumentId}
                                   onclick={handleLinkClick}>{row.action}</a>
                            </template>
                        </template>
                    </li>
                </template>
            </ul>
        </section>
    </template>
</template>
