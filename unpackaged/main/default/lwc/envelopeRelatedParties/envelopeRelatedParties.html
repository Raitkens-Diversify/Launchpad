<!-- Author: Mile Cacanovic -->
<template>
    <div class="related-parties">
        <template for:each={groups} for:item="group">
            <div key={group.key} class="related-parties__group">
                <c-envelope-related-party-group
                    party-key={group.key}
                    title={group.title}
                    note={group.note}
                    parties={group.parties}
                    max-parties={group.max}
                    waived={group.waived}
                    empty-message={group.emptyMessage}
                    onpartyaction={handlePartyAction}
                    onpartyremove={handlePartyRemove}>
                </c-envelope-related-party-group>
                <!-- Only a role that can be satisfied by affirmation carries a waiverLabel. -->
                <template lwc:if={group.waiverLabel}>
                    <lightning-input
                        type="checkbox"
                        class="related-parties__waiver"
                        label={group.waiverLabel}
                        checked={group.waived}
                        disabled={group.waiverDisabled}
                        data-key={group.key}
                        onchange={handleWaiverChange}>
                    </lightning-input>
                </template>
            </div>
        </template>
    </div>

    <!-- "Select existing" dialog, opened imperatively from a subsection's Select Existing button; it
         fetches the members itself and bubbles the pick back via memberselected. -->
    <c-envelope-select-member-modal
        lwc:ref="selectMemberModal"
        onmemberselected={handleMemberSelected}
        onclose={handleModalClose}>
    </c-envelope-select-member-modal>

    <!-- "Create new" dialog, opened imperatively from a subsection's Create New button; on save it
         bubbles the created pending member(s) back via membercreated, each carrying the party type
         to file it under. -->
    <c-envelope-create-pending-member-modal
        lwc:ref="createMemberModal"
        variant="relatedParty"
        member-type-options={memberTypeOptions}
        onmembercreated={handleMembersCreated}
        onclose={handleModalClose}>
    </c-envelope-create-pending-member-modal>
</template>
