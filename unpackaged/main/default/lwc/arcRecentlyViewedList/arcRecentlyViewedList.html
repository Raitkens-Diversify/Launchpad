<template>
  <article
    class="arc-recently-viewed"
    aria-labelledby="arc-recently-viewed-title"
  >
    <div class="arc-recently-viewed__content">
      <header class="arc-recently-viewed__header">
        <div class="arc-recently-viewed__title-row">
          <h2 id="arc-recently-viewed-title" class="arc-recently-viewed__title">
            {title}
          </h2>
        </div>
        <template lwc:if={showOverflowMenu}>
          <button
            type="button"
            class="arc-recently-viewed__overflow-button"
            aria-label="More actions"
          >
            <span
              class="arc-recently-viewed__overflow-icon"
              style={overflowIconStyle}
              aria-hidden="true"
            ></span>
          </button>
        </template>
      </header>

      <template lwc:if={errorMessage}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          {errorMessage}
        </div>
      </template>

      <template lwc:if={isInitialLoading}>
        <div class="arc-recently-viewed__loading">
          <c-arc-loading-spinner
            alternative-text="Loading recently viewed records"
            size="small"
          ></c-arc-loading-spinner>
        </div>
      </template>

      <template lwc:elseif={hasItems}>
        <ul
          class="arc-recently-viewed__list"
          style={listStyle}
          aria-label={title}
        >
          <template for:each={listItems} for:item="item">
            <li key={item.id} class="arc-recently-viewed__item">
              <a
                href={item.recordUrl}
                class="arc-recently-viewed__row"
                data-record-id={item.id}
                aria-label={item.ariaLabel}
                onclick={handleRowClick}
              >
                <span class="arc-recently-viewed__icon-wrap" aria-hidden="true">
                  <span
                    class="arc-recently-viewed__icon"
                    style={item.iconStyle}
                  ></span>
                </span>

                <span class="arc-recently-viewed__content-text">
                  <span class="arc-recently-viewed__name">{item.name}</span>
                  <template lwc:if={item.hasMetadata}>
                    <span class="arc-recently-viewed__metadata"
                      >{item.metadata}</span
                    >
                  </template>
                </span>

                <span
                  class="arc-recently-viewed__chevron"
                  style={caretIconStyle}
                  aria-hidden="true"
                ></span>
              </a>
            </li>
          </template>
        </ul>
      </template>

      <template lwc:else>
        <div class="arc-recently-viewed__empty" role="status">
          No recently viewed records.
        </div>
      </template>
    </div>

    <template lwc:if={showFooter}>
      <div class="arc-recently-viewed__footer-wrap">
        <footer class="arc-recently-viewed__footer">
          <span class="arc-recently-viewed__count">{footerLabel}</span>
          <template lwc:if={showViewAll}>
            <a
              href={viewAllUrl}
              class="arc-recently-viewed__view-all"
              onclick={handleViewAllClick}
            >
              <span>View All</span>
              <span
                class="arc-recently-viewed__view-all-icon"
                style={caretIconStyle}
                aria-hidden="true"
              ></span>
            </a>
          </template>
        </footer>
      </div>
    </template>
  </article>
</template>
