<template>
    <c-ds-chrome logo-url={logoUrl} hide-branding={hideBranding} brand-label="Event Center" onbrandclick={handleBrandHome}>
        <!-- One frame for both views (c-ds-page column): Calendar and Upcoming
             share the same max-width, gutters and padding, so switching tabs
             never moves the page edges. -->
        <c-ds-page column>
        <div class="ev">
            <header class="ev__head">
                <c-ds-breadcrumbs items={crumbItems} oncrumbselect={handleCrumb}></c-ds-breadcrumbs>
                <h1 class="ev__heading">Event Center</h1>
                <p class="ev__sub">Live webinars and recordings from the Diversify team.</p>
            </header>

            <c-ds-tabs class="ev__tabs" tabs={tabs} selected={view} label="Events views"
                       ontabchange={handleTabChange}></c-ds-tabs>

            <template if:true={isUpcomingView}>
                <div role="tabpanel" aria-label="Upcoming">
                    <template for:each={monthGroups} for:item="group">
                        <section key={group.key} class="ev__month">
                            <h2 class="ev__month-title">{group.label}</h2>
                            <div class="ev__list">
                            <template for:each={group.items} for:item="ev">
                                <article key={ev.id} class="ev__row">
                                    <c-ds-date-block value={ev.eventDatetime}></c-ds-date-block>
                                    <div class="ev__main">
                                        <div class="ev__title-row">
                                            <h3 class="ev__title">
                                                <button type="button" class="ev__title-btn"
                                                        data-slug={ev.slug}
                                                        onclick={handleTitle}>{ev.name}</button>
                                            </h3>
                                        </div>
                                        <template if:true={ev.meta}>
                                            <p class="ev__meta">{ev.meta}</p>
                                        </template>
                                        <template if:true={ev.description}>
                                            <p class="ev__desc">{ev.description}</p>
                                        </template>
                                        <div class="ev__actions">
                                            <template if:true={ev.cta.isSignup}>
                                                <c-ds-button label={ev.cta.primaryLabel} href={ev.cta.primaryHref}
                                                             target="_blank"></c-ds-button>
                                            </template>
                                        </div>
                                    </div>
                                </article>
                            </template>
                            </div>
                        </section>
                    </template>

                    <template if:true={showEmptyUpcoming}>
                        <p class="ev__empty">No upcoming events right now — check back soon.</p>
                    </template>

                    <template if:true={hasPast}>
                        <section class="ev__month ev__past">
                            <h2 class="ev__month-title">Past events</h2>
                            <div class="ev__list">
                            <template for:each={pastItems} for:item="ev">
                                <article key={ev.id} class="ev__row ev__row--past">
                                    <c-ds-date-block value={ev.eventDatetime}></c-ds-date-block>
                                    <div class="ev__main">
                                        <div class="ev__title-row">
                                            <h3 class="ev__title">
                                                <button type="button" class="ev__title-btn"
                                                        data-slug={ev.slug}
                                                        onclick={handleTitle}>{ev.name}</button>
                                            </h3>
                                            <c-ds-badge label="Recording" variant="info" size="sm"></c-ds-badge>
                                        </div>
                                        <template if:true={ev.meta}>
                                            <p class="ev__meta">{ev.meta}</p>
                                        </template>
                                        <template if:true={ev.description}>
                                            <p class="ev__desc">{ev.description}</p>
                                        </template>
                                        <div class="ev__actions">
                                            <template if:true={ev.cta.isWatch}>
                                                <c-ds-button label={ev.cta.primaryLabel}
                                                             data-slug={ev.slug}
                                                             onclick={handleWatch}></c-ds-button>
                                            </template>
                                            <template if:true={ev.cta.note}>
                                                <p class="ev__note">{ev.cta.note}</p>
                                            </template>
                                        </div>
                                    </div>
                                </article>
                            </template>
                            </div>
                        </section>
                    </template>
                </div>
            </template>

            <template if:true={isCalendarView}>
                <div role="tabpanel" aria-label="Calendar" class="ev__calendar">
                    <c-ds-calendar events={calendarEvents}
                                   month={currentMonth}
                                   layout="auto"
                                   label="Events calendar"
                                   onmonthchange={handleMonthChange}
                                   oneventselect={handleEventSelect}></c-ds-calendar>
                </div>
            </template>
        </div>
        </c-ds-page>

        <c-ds-popover is-open={popoverOpen} anchor-rect={anchorRect} label="Event details"
                      onclose={handlePopoverClose}>
            <template if:true={selectedEvent}>
                <div class="ev__pop">
                    <h3 class="ev__pop-title">{selectedEvent.name}</h3>
                    <p class="ev__meta ev__pop-when">{selectedEvent.when}</p>
                    <template if:true={selectedEvent.meta}>
                        <p class="ev__meta">{selectedEvent.meta}</p>
                    </template>
                    <template if:true={selectedEvent.description}>
                        <p class="ev__desc">{selectedEvent.description}</p>
                    </template>
                    <div class="ev__actions">
                        <template if:true={selectedEvent.cta.isSignup}>
                            <c-ds-button label={selectedEvent.cta.primaryLabel} href={selectedEvent.cta.primaryHref}
                                         target="_blank"></c-ds-button>
                        </template>
                        <template if:true={selectedEvent.cta.isWatch}>
                            <c-ds-button label={selectedEvent.cta.primaryLabel}
                                         data-slug={selectedEvent.slug}
                                         onclick={handleWatch}></c-ds-button>
                        </template>
                        <template if:true={selectedEvent.cta.note}>
                            <p class="ev__note">{selectedEvent.cta.note}</p>
                        </template>
                        <c-ds-button variant="link" label="View details" class="ev__view-details"
                                     data-slug={selectedEvent.slug}
                                     onclick={handleViewDetails}></c-ds-button>
                    </div>
                </div>
            </template>
        </c-ds-popover>

        <!-- Detail modal: the same c-event-detail the Resource Center route
             renders, loaded by slug on open. The header carries the name, so
             the body hides its own h1. -->
        <c-ds-modal-v2 is-open={modalOpen} title={modalTitle} size="large"
                       onclose={handleModalClose}>
            <div class="ev__modal"
                 onresourceselect={handleModalSibling}
                 onresourcedownload={handleModalDownload}>
                <template if:true={modalLoading}>
                    <div class="ev__modal-status">
                        <lightning-spinner alternative-text="Loading event" size="small"></lightning-spinner>
                    </div>
                </template>
                <template if:true={modalError}>
                    <p class="ev__modal-status" role="alert">{modalError}</p>
                </template>
                <template if:true={showModalDetail}>
                    <c-event-detail detail={modalDetail} link-ctx={linkCtx} hide-title></c-event-detail>
                </template>
            </div>
            <c-ds-button slot="footer" variant="quiet" label="Close" class="ev__modal-close"
                         onclick={handleModalClose}></c-ds-button>
        </c-ds-modal-v2>
    </c-ds-chrome>
</template>
