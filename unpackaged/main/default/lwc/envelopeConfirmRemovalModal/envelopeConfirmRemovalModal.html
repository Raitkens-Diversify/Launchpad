<template>
    <c-ds-modal-v2
        is-open={isOpen}
        title={title}
        size={size}
        onclose={handleClose}>
        <div slot="header" class="confirm-removal__heading">
            <div class="confirm-removal__title-row">
                <lightning-icon
                    icon-name="utility:delete"
                    size="small"
                    class="confirm-removal__title-icon"
                    alternative-text="Delete">
                </lightning-icon>
                <h2 class="confirm-removal__title">{title}</h2>
            </div>
        </div>

        <p class="confirm-removal__message">
            {messageBefore}<template lwc:if={hasHighlight}>'<strong>{messageHighlight}</strong>'</template>{messageAfter}
        </p>

        <slot></slot>

        <div slot="footer" class="confirm-removal__footer">
            <lightning-button
                variant="neutral"
                label="Cancel"
                disabled={busy}
                onclick={handleCancel}
            ></lightning-button>
            <div class="env-busy-button">
                <lightning-button
                    variant="destructive"
                    label={confirmLabel}
                    icon-name={confirmIconName}
                    icon-position="left"
                    disabled={busy}
                    onclick={handleConfirm}
                ></lightning-button>
                <template lwc:if={busy}>
                    <lightning-spinner
                        size="small"
                        variant="brand"
                        alternative-text="Working">
                    </lightning-spinner>
                </template>
            </div>
        </div>
    </c-ds-modal-v2>
</template>
