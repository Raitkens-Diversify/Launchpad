<template>
    <div class="add-cta">
        <button
            type="button"
            class="add-cta__btn"
            data-action="addMember"
            onclick={handleClick}>
            <lightning-icon
                icon-name="utility:adduser"
                size="small"
                class="add-cta__icon add-cta__icon_member"
                alternative-text="Add Client">
            </lightning-icon>
            <span class="add-cta__label">Add Client</span>
            <lightning-icon
                icon-name="utility:add"
                size="x-small"
                class="add-cta__plus"
                alternative-text="Add Client">
            </lightning-icon>
        </button>

        <button
            type="button"
            class="add-cta__btn"
            data-action="addIsa"
            onclick={handleClick}>
            <lightning-icon
                icon-name="utility:new"
                size="small"
                class="add-cta__icon add-cta__icon_isa"
                alternative-text="Add Investment or Service">
            </lightning-icon>
            <span class="add-cta__label">Add Investment or Service</span>
            <lightning-icon
                icon-name="utility:add"
                size="x-small"
                class="add-cta__plus"
                alternative-text="Add Investment or Service">
            </lightning-icon>
        </button>
    </div>
</template>
