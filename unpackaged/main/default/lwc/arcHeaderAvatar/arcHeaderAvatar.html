<template>
  <div class="avatar-wrap">
    <button
      class="avatar"
      type="button"
      title={fullName}
      aria-label={menuAriaLabel}
      aria-haspopup="menu"
      aria-expanded={isMenuOpen}
      onclick={handleToggleMenu}
    >
      {initials}
    </button>

    <template lwc:if={isMenuOpen}>
      <!-- Closes on any click that is not the menu itself; the backdrop sits
           under the menu but over everything else. -->
      <div
        class="avatar-backdrop"
        role="presentation"
        onclick={handleCloseMenu}
      ></div>

      <div class="avatar-menu" role="menu" aria-label="Profile">
        <div class="avatar-menu__identity">
          <p class="avatar-menu__name">{fullName}</p>
          <p class="avatar-menu__username">{username}</p>
        </div>

        <button
          class="avatar-menu__item avatar-menu__item--danger"
          type="button"
          role="menuitem"
          onclick={handleLogout}
        >
          Log out
        </button>
      </div>
    </template>
  </div>

  <c-ds-modal-v2
    is-open={isLogoutConfirmOpen}
    title="Log out of ARC?"
    size="small"
    onclose={handleCloseLogoutConfirm}
  >
    <div slot="header" class="logout-confirm__heading">
      <lightning-icon
        icon-name="utility:logout"
        size="small"
        class="logout-confirm__icon"
        alternative-text="Log out"
      ></lightning-icon>
      <h2 class="logout-confirm__title">Log out of ARC?</h2>
    </div>

    <p class="logout-confirm__message">
      You'll need to sign back in to access your cases, envelopes, and accounts.
    </p>

    <!-- Preview signs you out of Salesforce, not just the site, so say so
         before it happens rather than after. -->
    <template lwc:if={isPreviewHost}>
      <p class="logout-confirm__note">
        You're in Experience Builder preview, so this ends your Salesforce
        session too and you'll need to sign back in to keep previewing.
      </p>
    </template>

    <div slot="footer" class="logout-confirm__footer">
      <lightning-button
        variant="neutral"
        label="Cancel"
        onclick={handleCloseLogoutConfirm}
      ></lightning-button>
      <lightning-button
        variant="destructive"
        label="Log out"
        onclick={handleConfirmLogout}
      ></lightning-button>
    </div>
  </c-ds-modal-v2>
</template>
