<template>
    <div class="rc-cat">
        <!-- Phone widths only (CSS): the sidebar becomes a drawer behind this button. -->
        <button type="button" class="rc-cat__nav-toggle"
                aria-expanded={navToggleExpanded}
                onclick={handleNavToggle}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
                <path d="M3 6h18M3 12h18M3 18h18"></path>
            </svg>
            {navToggleLabel}
        </button>
        <aside class={navClass} onkeydown={handleNavKeydown}>
            <c-ds-tree heading="All topics"
                       roots={navRoots}
                       active-key={activeKey}
                       show-counts
                       onnavselect={handleNavSelect}></c-ds-tree>
        </aside>

        <main class="rc-cat__main">
            <template if:true={loading}>
                <div class="rc-cat__status">
                    <lightning-spinner alternative-text="Loading category" size="small"></lightning-spinner>
                </div>
            </template>

            <template if:true={detail}>
                <c-ds-breadcrumbs items={crumbItems}
                                  collapse-at="4"
                                  oncrumbselect={handleCrumb}></c-ds-breadcrumbs>

                <!-- The page is the top-level topic; the pills narrow it. -->
                <h1 class="rc-cat__title">{pageTitle}</h1>
                <template if:true={pageDescription}>
                    <p class="rc-cat__desc">{pageDescription}</p>
                </template>

                <!-- Cascading subtopic rows: the route's node decides which rows
                     show; a pill just asks the host to route (same handler as
                     the sidebar). -->
                <template if:true={showFilterRows}>
                    <c-subtopic-filter-rows rows={filterRowsData}
                                            onnavselect={handleNavSelect}></c-subtopic-filter-rows>
                </template>

                <template if:false={isEmpty}>
                    <div class="rc-cat__toolbar">
                        <p class="rc-cat__count" aria-live="polite">{countLine}</p>
                        <!-- The secondary facet: compact chips behind a "Type" label so
                             they never read as more subtopics. -->
                        <template if:true={showTypeChips}>
                            <c-ds-filter-chips label="Type"
                                               compact
                                               group-label="Filter by type"
                                               chips={typeChips}
                                               selected={typeFilter}
                                               onselect={handleTypeSelect}></c-ds-filter-chips>
                        </template>
                    </div>

                    <!-- Every resource in the selected subtree, flat. The cards'
                         composed contentselect and the path tags' pathselect both
                         reach these listeners. -->
                    <template if:true={hasItems}>
                        <c-ds-item-list variant="cards"
                                        noun="resource"
                                        items={items}
                                        oncontentselect={handleContentSelect}
                                        onpathselect={handlePathSelect}></c-ds-item-list>
                    </template>

                    <template if:true={isTypeEmpty}>
                        <p class="rc-cat__empty">
                            {typeEmptyText}
                            <button type="button" class="rc-cat__link-btn" onclick={handleTypeClear}>Show all types</button>
                        </p>
                    </template>
                </template>

                <template if:true={isEmpty}>
                    <p class="rc-cat__empty">There are no resources here yet. Check back soon.</p>
                </template>
            </template>

            <template if:true={error}>
                <p class="rc-cat__empty">{error}</p>
            </template>
        </main>
    </div>
    <c-resource-help-band></c-resource-help-band>
</template>
