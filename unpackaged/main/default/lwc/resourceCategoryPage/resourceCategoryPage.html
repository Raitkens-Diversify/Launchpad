<template>
    <div class="rc-cat">
        <!-- Phone widths only (CSS): the sidebar becomes a drawer behind this button. -->
        <button type="button" class="rc-cat__nav-toggle"
                aria-expanded={navToggleExpanded}
                onclick={handleNavToggle}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
                <path d="M3 6h18M3 12h18M3 18h18"></path>
            </svg>
            {navToggleLabel}
        </button>
        <aside class={navClass} onkeydown={handleNavKeydown}>
            <c-ds-tree heading="All topics"
                       roots={navRoots}
                       active-key={activeKey}
                       show-counts
                       onnavselect={handleNavSelect}></c-ds-tree>
        </aside>

        <main class="rc-cat__main">
            <template if:true={loading}>
                <div class="rc-cat__status">
                    <lightning-spinner alternative-text="Loading category" size="small"></lightning-spinner>
                </div>
            </template>

            <template if:true={detail}>
                <c-ds-breadcrumbs items={crumbItems}
                                  collapse-at="4"
                                  oncrumbselect={handleCrumb}></c-ds-breadcrumbs>

                <h1 class="rc-cat__title">{detail.name}</h1>
                <template if:true={detail.description}>
                    <p class="rc-cat__desc">{detail.description}</p>
                </template>
                <!-- The branch: one card per direct subcategory, same at every depth. -->
                <template if:true={showSectionCards}>
                    <c-ds-section-cards label="In this category"
                                        noun="resource"
                                        items={sectionCardItems}
                                        onnavselect={handleSlugSelect}></c-ds-section-cards>
                </template>

                <!-- Own resources, or the ones inherited from the children. The
                     cards' composed contentselect reaches this listener. -->
                <template if:true={showList}>
                    <c-ds-item-list variant="cards"
                                    noun="resource"
                                    heading={ownHeading}
                                    items={ownItems}
                                    groups={inheritedGroups}
                                    oncontentselect={handleContentSelect}
                                    onnavselect={handleSlugSelect}></c-ds-item-list>
                </template>

                <template if:true={isEmpty}>
                    <p class="rc-cat__empty">There are no resources here yet. Check back soon.</p>
                </template>
            </template>

            <template if:true={error}>
                <p class="rc-cat__empty">{error}</p>
            </template>
        </main>
    </div>
    <c-resource-help-band></c-resource-help-band>
</template>
