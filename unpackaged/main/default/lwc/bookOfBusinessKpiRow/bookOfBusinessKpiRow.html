<template>
  <section class="div-kpi-row" aria-label="Key metrics">
    <template for:each={kpis} for:item="kpi">
      <c-book-of-business-kpi-card
        key={kpi.id}
        label={kpi.label}
        value={kpi.value}
        subtext={kpi.subtext}
        trend-label={kpi.trendLabel}
        trend-direction={kpi.trendDirection}
      ></c-book-of-business-kpi-card>
    </template>
  </section>
</template>
