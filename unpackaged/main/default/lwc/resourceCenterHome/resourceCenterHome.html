<template>
    <!-- Navy hero: shared c-ds-hero (also used by nexsHome and the UAT
         dashboard), replacing this file's former .rc-hero replica. -->
    <c-ds-hero eyebrow="Resource Center" headline="Find the resources you need">
        <div class="rc-hero__search">
            <c-resource-search-bar placeholder="Search resources…"
                onselect={handleSuggestionSelect}
                onsearch={handleSearchSubmit}></c-resource-search-bar>
        </div>
        <button type="button" class="rc-hero__guide" onclick={handleGetHelp}>
            Not sure where to start? Get Help &rarr;
        </button>
    </c-ds-hero>

    <div class="rc-body">
        <template if:true={hasFeatured}>
            <section class="rc-section">
                <h2 class="rc-section__title">Featured</h2>
                <div class="rc-grid rc-grid--cards">
                    <template for:each={featured} for:item="r">
                        <c-resource-card key={r.id} resource={r}></c-resource-card>
                    </template>
                </div>
            </section>
        </template>

        <section class="rc-section">
            <h2 class="rc-section__title">Browse by category</h2>

            <template if:true={categoriesLoading}>
                <div class="rc-status">
                    <lightning-spinner alternative-text="Loading categories" size="small"></lightning-spinner>
                </div>
            </template>

            <template if:true={hasCategories}>
                <ul class="rc-topics">
                    <template for:each={categoryItems} for:item="cat">
                        <li key={cat.id}>
                            <button class="rc-topics__card" type="button"
                                    data-slug={cat.slug} onclick={handleCategory}>
                                <span class="rc-topics__icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                         stroke-width="2" stroke-linecap="round"
                                         stroke-linejoin="round" focusable="false">
                                        <path d={cat.iconPath}></path>
                                    </svg>
                                </span>
                                <span class="rc-topics__label">{cat.name}</span>
                                <template if:true={cat.description}>
                                    <span class="rc-topics__desc">{cat.description}</span>
                                </template>
                                <span class="rc-topics__count">{cat.resourceCount} resources</span>
                            </button>
                        </li>
                    </template>
                </ul>
            </template>

            <template if:true={showCategoriesEmpty}>
                <p class="rc-empty">No categories are available yet.</p>
            </template>
            <template if:true={categoriesError}>
                <p class="rc-empty">We couldn't load categories. Please try again later.</p>
            </template>
        </section>
    </div>

    <c-resource-help-band></c-resource-help-band>
</template>
