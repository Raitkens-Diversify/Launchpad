<template>
  <div class="div-table-shell">
    <template lwc:if={hasTitle}>
      <h2 class="div-table-title">{title}</h2>
    </template>
    <div class="div-table-card">
      <template lwc:if={showLoading}>
        <div
          class="styled-data-table__loading"
          role="status"
          aria-live="polite"
          aria-busy="true"
        >
          <c-ds-skeleton variant="row" count="5"></c-ds-skeleton>
        </div>
      </template>
      <template lwc:else>
      <div class={scrollContainerClass}>
        <div class="div-table-scroll__track">
        <table class={tableClass} aria-label={ariaLabel}>
          <thead>
            <tr>
              <template for:each={headerColumns} for:item="column">
                <th
                  key={column.key}
                  scope="col"
                  aria-sort={column.ariaSort}
                  class={column.headerClass}
                  style={column.style}
                >
                  <template lwc:if={column.sortable}>
                    <button
                      type="button"
                      class="div-table__sort-button"
                      data-field={column.key}
                      aria-label={column.label}
                      onclick={handleSort}
                      onkeydown={handleSortKeyDown}
                    >
                      <span>{column.label}</span>
                      <lightning-icon
                        icon-name={column.sortIcon}
                        size="xx-small"
                        alternative-text="Sort direction"
                        class={column.sortIconClass}
                      ></lightning-icon>
                    </button>
                  </template>
                  <template lwc:else>
                    <span class="div-table__header-label">{column.label}</span>
                  </template>
                </th>
              </template>
              <template lwc:if={hasRowActions}>
                <th
                  scope="col"
                  class="div-table__header-actions styled-data-table__header--actions"
                >
                  <span class="slds-assistive-text">Actions</span>
                </th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template lwc:if={hasRows}>
              <template for:each={tableBodyItems} for:item="item">
                <template lwc:if={item.isDataRow}>
                  <tr
                    key={item.key}
                    class={item.row.rowClass}
                    data-id={item.row.key}
                  >
                    <template for:each={item.row.cells} for:item="cell">
                      <td key={cell.key} data-label={cell.label} class={cell.cellClass} style={cell.style}>
                        <template lwc:if={cell.isExpand}>
                          <button
                            type="button"
                            class="styled-data-table__expand-button"
                            data-id={item.row.key}
                            aria-expanded={cell.isExpanded}
                            aria-label={cell.expandAriaLabel}
                            onclick={handleExpandChevronClick}
                          >
                            <lightning-icon
                              icon-name={cell.expandIcon}
                              size="xx-small"
                              class="styled-data-table__expand-icon"
                              alternative-text="Expand row"
                            ></lightning-icon>
                          </button>
                        </template>
                        <template lwc:elseif={cell.isLink}>
                          <span class="styled-data-table__link-cell">
                            <template lwc:if={cell.showExpandChevron}>
                              <button
                                type="button"
                                class="styled-data-table__expand-button"
                                data-id={item.row.key}
                                aria-expanded={cell.isExpanded}
                                aria-label={cell.expandAriaLabel}
                                onclick={handleExpandChevronClick}
                              >
                                <lightning-icon
                                  icon-name={cell.expandIcon}
                                  size="xx-small"
                                  class="styled-data-table__expand-icon"
                                  alternative-text="Expand row"
                                ></lightning-icon>
                              </button>
                            </template>
                            <a
                              class="div-table__link"
                              href={cell.recordUrl}
                              data-record-id={cell.recordId}
                              data-object-api-name={cell.objectApiName}
                              aria-label={cell.linkAriaLabel}
                              onclick={handleRecordLinkClick}
                            >
                              {cell.value}
                            </a>
                          </span>
                        </template>
                        <template lwc:elseif={cell.isPill}>
                          <span class={cell.pillClass}>{cell.value}</span>
                        </template>
                        <template lwc:else>
                          {cell.value}
                        </template>
                      </td>
                    </template>
                    <template lwc:if={hasRowActions}>
                      <td
                        class="styled-data-table__cell--actions"
                        onclick={handleActionCellClick}
                      >
                        <lightning-button-menu
                          variant="bare"
                          icon-name="utility:threedots_vertical"
                          menu-alignment="right"
                          alternative-text="Show actions"
                          title="Show actions"
                          data-id={item.row.key}
                          onselect={handleMenuSelect}
                        >
                          <template for:each={rowActions} for:item="action">
                            <lightning-menu-item
                              key={action.name}
                              value={action.name}
                              label={action.label}
                              prefix-icon-name={action.iconName}
                            ></lightning-menu-item>
                          </template>
                        </lightning-button-menu>
                      </td>
                    </template>
                  </tr>
                </template>
                <template lwc:elseif={item.isWorkDetailSection}>
                  <tr key={item.key} class="styled-data-table__work-detail-section">
                    <td
                      colspan={item.sectionColspan}
                      class="styled-data-table__work-detail-section-cell"
                    >
                      <div class="styled-data-table__work-detail-panel">
                        <table
                          class="styled-data-table__work-detail-table"
                          aria-label="Case tasks"
                        >
                          <thead>
                            <tr>
                              <th
                                scope="col"
                                class="styled-data-table__work-detail-col-tasks"
                              >
                                <button
                                  type="button"
                                  class="div-table__sort-button"
                                  disabled
                                  aria-label="Tasks"
                                >
                                  <span>Tasks</span>
                                  <lightning-icon
                                    icon-name="utility:arrowup"
                                    size="xx-small"
                                    alternative-text="Sort direction"
                                    class="div-table__sort-icon"
                                  ></lightning-icon>
                                </button>
                              </th>
                              <th scope="col">Owner</th>
                              <th scope="col">Status</th>
                              <th scope="col">Due Date</th>
                              <th scope="col">Completed Date</th>
                              <template lwc:if={item.hasDetailRowActions}>
                                <th
                                  scope="col"
                                  class="styled-data-table__work-detail-col-actions"
                                >
                                  <span class="slds-assistive-text">Actions</span>
                                </th>
                              </template>
                            </tr>
                          </thead>
                          <tbody>
                            <template lwc:if={item.hasGroups}>
                              <template for:each={item.groupViews} for:item="group">
                                <tr
                                  key={group.key}
                                  class="styled-data-table__work-detail-group-row"
                                >
                                  <td
                                    colspan={group.detailColumnCount}
                                    class="styled-data-table__work-detail-group-cell"
                                  >
                                    <button
                                      type="button"
                                      class="styled-data-table__work-detail-group"
                                      data-row-key={group.rowKey}
                                      data-group-key={group.groupKey}
                                      aria-expanded={group.isExpanded}
                                      onclick={handleDetailGroupToggle}
                                      onkeydown={handleDetailGroupKeyDown}
                                    >
                                      <lightning-icon
                                        icon-name={group.expandIcon}
                                        size="xx-small"
                                        class="styled-data-table__work-detail-group-icon"
                                        alternative-text="Toggle task group"
                                      ></lightning-icon>
                                      <span>{group.label}</span>
                                    </button>
                                  </td>
                                </tr>
                                <template for:each={group.tasks} for:item="task">
                                  <tr
                                    key={task.id}
                                    class="styled-data-table__work-detail-task-row"
                                    onclick={handleDetailInteraction}
                                  >
                                    <td class="styled-data-table__work-detail-task-cell">
                                      <span class="styled-data-table__work-detail-task-name">
                                        <template lwc:if={task.isStarred}>
                                          <lightning-icon
                                            icon-name="utility:favorite"
                                            size="xx-small"
                                            class="styled-data-table__work-detail-star"
                                            alternative-text="Starred task"
                                          ></lightning-icon>
                                        </template>
                                        <a
                                          class="div-table__link"
                                          href={task.recordUrl}
                                          data-record-id={task.id}
                                          aria-label={task.linkAriaLabel}
                                          onclick={handleDetailTaskLinkClick}
                                        >
                                          {task.name}
                                        </a>
                                      </span>
                                    </td>
                                    <td>{task.ownerName}</td>
                                    <td class="div-table__cell--pill">
                                      <span class={task.statusPillClass}>{task.status}</span>
                                    </td>
                                    <td>{task.dueDate}</td>
                                    <td>{task.completedDate}</td>
                                    <template lwc:if={item.hasDetailRowActions}>
                                      <td
                                        class="styled-data-table__cell--actions"
                                        onclick={handleDetailInteraction}
                                      >
                                        <lightning-button-menu
                                          variant="bare"
                                          icon-name="utility:threedots_vertical"
                                          menu-alignment="right"
                                          alternative-text="Show task actions"
                                          title="Show task actions"
                                          data-id={task.id}
                                          onselect={handleDetailTaskMenuSelect}
                                        >
                                          <template
                                            for:each={detailRowActions}
                                            for:item="action"
                                          >
                                            <lightning-menu-item
                                              key={action.name}
                                              value={action.name}
                                              label={action.label}
                                              prefix-icon-name={action.iconName}
                                            ></lightning-menu-item>
                                          </template>
                                        </lightning-button-menu>
                                      </td>
                                    </template>
                                  </tr>
                                </template>
                              </template>
                            </template>
                            <template lwc:else>
                              <tr class="styled-data-table__work-detail-empty-row">
                                <td colspan={item.detailColumnCount}>
                                  No tasks found for this case.
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </td>
                  </tr>
                </template>
                <template lwc:elseif={item.isDetailWrapper}>
                  <tr key={item.key} class="styled-data-table__expand-row">
                    <td colspan={emptyColspan}>
                      <slot name="rowdetail"></slot>
                    </td>
                  </tr>
                </template>
              </template>
            </template>
            <template lwc:elseif={showEmptyRow}>
              <tr class="styled-data-table__empty-row">
                <td
                  colspan={emptyColspan}
                  class="styled-data-table__empty-cell"
                  role="status"
                >
                  {emptyMessage}
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        </div>
      </div>
      <template lwc:if={showPager}>
        <footer class="div-table-card__footer">
          <div class="div-table-pager">
            <div class="div-table-pager__page-size">
              <label class="div-table-pager__page-size-label" for="styled-table-page-size">
                Items per page
              </label>
              <div class="div-table-pager__page-size-control">
                <select
                  id="styled-table-page-size"
                  class="div-table-pager__page-size-select"
                  value={pageSizeSelectValue}
                  aria-label="Items per page"
                  onchange={handlePageSizeChange}
                >
                  <template for:each={pageSizeOptionViews} for:item="option">
                    <option
                      key={option.key}
                      value={option.value}
                      selected={option.isSelected}
                    >
                      {option.label}
                    </option>
                  </template>
                </select>
                <lightning-icon
                  icon-name="utility:down"
                  size="xx-small"
                  class="div-table-pager__page-size-icon"
                  aria-hidden="true"
                ></lightning-icon>
              </div>
            </div>

            <nav class="div-table-pager__nav" aria-label="Pagination">
              <button
                type="button"
                class="div-table-pager__btn div-table-pager__btn--icon"
                aria-label="Previous page"
                disabled={prevDisabled}
                onclick={handlePrevious}
              >
                <lightning-icon
                  icon-name="utility:chevronleft"
                  size="xx-small"
                  aria-hidden="true"
                ></lightning-icon>
              </button>

              <template for:each={pageItems} for:item="item">
                <template lwc:if={item.isGap}>
                  <span key={item.key} class="div-table-pager__gap" aria-hidden="true">…</span>
                </template>
                <template lwc:else>
                  <button
                    key={item.key}
                    type="button"
                    class={item.cssClass}
                    data-page={item.page}
                    aria-current={item.ariaCurrent}
                    onclick={handlePageClick}
                  >
                    {item.label}
                  </button>
                </template>
              </template>

              <button
                type="button"
                class="div-table-pager__btn div-table-pager__btn--icon"
                aria-label="Next page"
                disabled={nextDisabled}
                onclick={handleNext}
              >
                <lightning-icon
                  icon-name="utility:chevronright"
                  size="xx-small"
                  aria-hidden="true"
                ></lightning-icon>
              </button>
            </nav>
          </div>
        </footer>
      </template>
      </template>
    </div>
  </div>
</template>
