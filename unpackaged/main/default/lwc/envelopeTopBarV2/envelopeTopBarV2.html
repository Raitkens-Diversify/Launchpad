<template>
    <header class="topbar">
        <!-- Default: Diversify logo + breadcrumb (list / workspace). -->
        <template lwc:if={isDefault}>
            <div class="topbar__left">
                <img class="topbar__logo" src={logoUrl} alt="Diversify" />
                <!-- Breadcrumb: the base lightning-breadcrumb, themed via envelopeWizardStyles.css.
                     Hidden entirely (with its leading divider) when no crumbs are passed — e.g. the shell. -->
                <template if:true={hasBreadcrumb}>
                    <span class="topbar__divider" aria-hidden="true"></span>
                    <div class="topbar__ds-breadcrumb">
                        <lightning-breadcrumbs>
                            <template for:each={breadcrumbItems} for:item="crumb">
                                <lightning-breadcrumb
                                    key={crumb.key}
                                    label={crumb.label}
                                    name={crumb.key}
                                    onclick={handleDsCrumbClick}>
                                </lightning-breadcrumb>
                            </template>
                        </lightning-breadcrumbs>
                    </div>
                </template>
            </div>

            <template if:true={showReview}>
                <lightning-button
                    class="topbar__review"
                    variant="brand"
                    label="Review and Submit"
                    disabled={reviewDisabled}
                    onclick={handleReview}>
                </lightning-button>
            </template>
        </template>

        <!-- Focused: leading screen title + envelope name + optional status (full-screen review views). The Review/Close actions sit on the right. -->
        <template lwc:if={isFocused}>
            <div class="topbar__left">
                <span class="topbar__title">{leadingTitle}</span>
                <span class="topbar__divider" aria-hidden="true"></span>
                <span class="topbar__envelope">{envelopeName}</span>
                <template if:true={hasStatus}>
                    <span class="topbar__status">
                        <lightning-icon
                            class="topbar__status-icon"
                            icon-name="utility:warning"
                            size="x-small"
                            alternative-text="Warning">
                        </lightning-icon>
                        <span class="topbar__status-text">{statusText}</span>
                    </span>
                </template>
            </div>

            <div class="topbar__actions">
                <template if:true={showReview}>
                    <lightning-button
                        class="topbar__review"
                        variant="brand"
                        label="Review and Submit"
                        disabled={reviewDisabled}
                        onclick={handleReview}>
                    </lightning-button>
                </template>
                <template if:true={showClose}>
                    <lightning-button
                        class="topbar__close"
                        variant="base"
                        label="Close"
                        onclick={handleClose}>
                    </lightning-button>
                </template>
            </div>
        </template>
    </header>
</template>
